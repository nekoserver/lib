openapi: 3.0.3
info:
  title: Upload API Sample
  version: 1.0.0
  description: Multipart upload and metadata retrieval sample.
servers:
  - url: https://api.example.com
tags:
  - name: files
paths:
  /files:
    post:
      tags: [files]
      summary: Upload file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                category:
                  type: string
                  example: profile-image
              required: [file]
      responses:
        "201":
          description: Upload success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileResource"
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -X POST "https://api.example.com/files" \
              -F "file=@./avatar.png" \
              -F "category=profile-image"
        - lang: javascript
          label: JavaScript (fetch)
          source: |
            const formData = new FormData();
            formData.append("file", fileInput.files[0]);
            formData.append("category", "profile-image");

            const response = await fetch("https://api.example.com/files", {
              method: "POST",
              body: formData
            });
            console.log(await response.json());
        - lang: python
          label: Python (requests)
          source: |
            import requests

            with open("./avatar.png", "rb") as fp:
              files = {"file": fp}
              data = {"category": "profile-image"}
              result = requests.post("https://api.example.com/files", files=files, data=data).json()
              print(result)
  /files/{fileId}:
    get:
      tags: [files]
      summary: Get file metadata
      parameters:
        - in: path
          name: fileId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileResource"
        "404":
          description: Not found
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl "https://api.example.com/files/file_001"
        - lang: javascript
          label: JavaScript (fetch)
          source: |
            const fileId = "file_001";
            const response = await fetch(`https://api.example.com/files/${fileId}`);
            console.log(await response.json());
        - lang: python
          label: Python (requests)
          source: |
            import requests
            file_id = "file_001"
            data = requests.get(f"https://api.example.com/files/{file_id}").json()
            print(data)

components:
  schemas:
    FileResource:
      type: object
      properties:
        id:
          type: string
          example: file_001
        filename:
          type: string
          example: avatar.png
        mimeType:
          type: string
          example: image/png
        size:
          type: integer
          example: 204800
        category:
          type: string
          example: profile-image
        createdAt:
          type: string
          format: date-time
          example: "2026-03-05T14:00:00Z"
      required: [id, filename, mimeType, size, createdAt]
