# AIチャットの埋め込みページとストリームを、server.jsではなくlibのストリームのサーバーへ送る。
# restore-claude-host.sh が /etc/apache2/lib-chat.conf に置き、VirtualHostの `RewriteEngine On`
# の直後で Include する（既存の「WebSocketはすべて8080へ」の規則より前に置くため）。
# 8092: chat_http_stream.py（埋め込みページ・chat/の資産・SSE・NDJSON・JSON Text Sequence・セッション）
# 8091: chat_websocket.py（WebSocket）
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/lib/api/chat/ws$ ws://127.0.0.1:8091/lib/api/chat/ws [P,L]
RewriteRule ^/lib/api/chat/(.+)$ http://127.0.0.1:8092/lib/api/chat/$1 [P,L]
RewriteRule ^/lib/(conversation-embed\.html|chat/.*)$ http://127.0.0.1:8092/lib/$1 [P,L]
RewriteRule ^/lib/t/([A-Za-z0-9_-]+)/((?:conversation-embed\.html|chat/.*))$ http://127.0.0.1:8092/lib/t/$1/$2 [P,L]
# ストリームを溜めずに流す。
<Proxy "http://127.0.0.1:8092">
    ProxySet flushpackets=on
</Proxy>
