<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カレンダー</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      padding: 2rem;
      background: #f5f5f5;
    }
    .calendar {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      padding: 1.5rem;
      min-width: 320px;
    }
    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .calendar-header h2 {
      margin: 0;
      font-size: 1.2rem;
    }
    .calendar-header button {
      background: none;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      padding: 0.25rem 0.75rem;
      font-size: 1rem;
    }
    .calendar-header button:hover {
      background: #eee;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th {
      color: #555;
      font-weight: normal;
      padding: 0.4rem;
      text-align: center;
      font-size: 0.85rem;
    }
    th:first-child { color: #e55; }
    th:last-child  { color: #55e; }
    td {
      text-align: center;
      padding: 0.4rem;
      border-radius: 50%;
      cursor: default;
      font-size: 0.95rem;
    }
    td.sunday    { color: #e55; }
    td.saturday  { color: #55e; }
    td.other-month { color: #ccc; }
    td.today {
      background: #3a7bd5;
      color: #fff !important;
      font-weight: bold;
      border-radius: 50%;
    }
    td.past-date {
      background: #e8e8e8;
      border-radius: 0;
    }
    td.has-schedule {
      background: #c8f0d0;
      cursor: pointer;
    }
    td.has-schedule.past {
      background: #b0b0b0;
      cursor: pointer;
      border-radius: 0;
    }
    td.today.has-schedule {
      background: #3a7bd5;
    }
    .today-label {
      text-align: center;
      margin-top: 1rem;
      color: #555;
      font-size: 0.9rem;
    }
    .today-label button {
      background: #3a7bd5;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      padding: 0.3rem 0.9rem;
      font-size: 0.9rem;
    }
    .today-label button:hover {
      background: #2a5fbf;
    }
    .tooltip {
      position: fixed;
      background: #333;
      color: #fff;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      z-index: 1000;
      white-space: pre-line;
      max-width: 220px;
      display: none;
      pointer-events: none;
      line-height: 1.6;
    }
    .tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: var(--arrow-left, 50%);
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: #333;
    }
  </style>
</head>
<body>
<div class="calendar">
  <div class="calendar-header">
    <button id="prev">&lt;</button>
    <h2 id="title"></h2>
    <button id="next">&gt;</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>日</th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th>土</th>
      </tr>
    </thead>
    <tbody id="calendar-body"></tbody>
  </table>
  <div class="today-label" id="today-label"></div>
</div>
<div class="tooltip" id="tooltip"></div>

<script>
  const now = new Date();
  let viewYear  = now.getFullYear();
  let viewMonth = now.getMonth(); // 0-indexed

  // スケジュールデータ [{year, month(0-indexed), day, timeRange, desc}]
  let allSchedules = [];

  // schedule.txt を読み込んでパース
  async function loadSchedule() {
    try {
      const resp = await fetch('schedule.txt');
      const text = await resp.text();
      const lines = text.split('\n');
      const seen = new Set();
      const entries = [];

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed) continue;
        // 「""」を含む行（説明が空）はスキップ
        if (trimmed.includes('""')) continue;
        // YYYY-MM-DD HH:MM-HH:MM "説明" の形式にマッチ
        const m = trimmed.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d+:\d+-\d+:\d+)\s+"(.+)"$/);
        if (!m) continue;
        const [, yr, mo, dy, timeRange, desc] = m;
        // 重複削除
        const key = yr + '-' + mo + '-' + dy + '-' + timeRange + '-' + desc;
        if (seen.has(key)) continue;
        seen.add(key);
        entries.push({
          year: parseInt(yr),
          month: parseInt(mo) - 1, // 0-indexed
          day: parseInt(dy),
          timeRange: timeRange,
          desc: desc
        });
      }

      // 時間の早い順にソート
      entries.sort(function(a, b) {
        if (a.year  !== b.year)  return a.year  - b.year;
        if (a.month !== b.month) return a.month - b.month;
        if (a.day   !== b.day)   return a.day   - b.day;
        return a.timeRange.localeCompare(b.timeRange);
      });

      allSchedules = entries;
    } catch (e) {
      console.warn('schedule.txt の読み込みに失敗しました:', e);
    }
    render();
  }

  // 表示月のスケジュールを日付ごとにまとめる
  function buildScheduleMap(year, month) {
    var map = {};
    for (var i = 0; i < allSchedules.length; i++) {
      var e = allSchedules[i];
      if (e.year === year && e.month === month) {
        if (!map[e.day]) map[e.day] = [];
        map[e.day].push(e.timeRange + ' ' + e.desc);
      }
    }
    return map;
  }

  var tooltip = document.getElementById('tooltip');

  function showTooltip(td, text) {
    tooltip.textContent = text;
    tooltip.style.display = 'block';
    var rect = td.getBoundingClientRect();
    var ttW = tooltip.offsetWidth;
    var ttH = tooltip.offsetHeight;
    var dateCenterX = rect.left + rect.width / 2;
    var left = dateCenterX - ttW / 2;
    var top  = rect.top - ttH - 10;
    var clampedLeft = Math.max(4, Math.min(left, window.innerWidth - ttW - 4));
    if (top < 4) top = rect.bottom + 10;
    // 矢印は常に選択した日付の中心を指すように調整
    var arrowLeft = dateCenterX - clampedLeft;
    tooltip.style.setProperty('--arrow-left', arrowLeft + 'px');
    tooltip.style.left = clampedLeft + 'px';
    tooltip.style.top  = top  + 'px';
  }

  function hideTooltip() {
    tooltip.style.display = 'none';
  }

  function render() {
    const today = new Date();
    const todayY = today.getFullYear();
    const todayM = today.getMonth();
    const todayD = today.getDate();

    document.getElementById('title').textContent =
      viewYear + '年 ' + (viewMonth + 1) + '月';

    const scheduleMap = buildScheduleMap(viewYear, viewMonth);

    // 当月の1日と末日
    const firstDay = new Date(viewYear, viewMonth, 1).getDay(); // 0=Sun
    const lastDate = new Date(viewYear, viewMonth + 1, 0).getDate();

    // 前月の末日
    const prevLastDate = new Date(viewYear, viewMonth, 0).getDate();

    const tbody = document.getElementById('calendar-body');
    tbody.innerHTML = '';
    hideTooltip();

    let date = 1;
    let nextDate = 1;
    let started = false;

    for (let row = 0; row < 6; row++) {
      const tr = document.createElement('tr');
      let hasCurrentMonth = false;

      for (let col = 0; col < 7; col++) {
        const td = document.createElement('td');

        if (!started && col < firstDay) {
          // 前月の日
          const d = prevLastDate - firstDay + col + 1;
          td.textContent = d;
          td.className = 'other-month' + (col === 0 ? ' sunday' : col === 6 ? ' saturday' : '');
        } else if (date > lastDate) {
          // 翌月の日
          td.textContent = nextDate++;
          td.className = 'other-month' + (col === 0 ? ' sunday' : col === 6 ? ' saturday' : '');
        } else {
          started = true;
          hasCurrentMonth = true;
          td.textContent = date;

          const isToday = (viewYear === todayY && viewMonth === todayM && date === todayD);
          if (isToday) {
            td.className = 'today';
          } else if (col === 0) {
            td.className = 'sunday';
          } else if (col === 6) {
            td.className = 'saturday';
          }

          // スケジュールがある日は背景を薄い緑色（過去日は薄い灰色）にしてツールチップを設定
          const isPast = (viewYear < todayY) ||
                         (viewYear === todayY && viewMonth < todayM) ||
                         (viewYear === todayY && viewMonth === todayM && date < todayD);
          // 過去日（1日〜前日）のセル背景を薄い灰色で塗りつぶす
          if (isPast) td.classList.add('past-date');
          const schedules = scheduleMap[date];
          if (schedules) {
            td.classList.add('has-schedule');
            if (isPast) td.classList.add('past');
            (function(cell, text) {
              cell.addEventListener('click', function(e) {
                e.stopPropagation();
                showTooltip(cell, text);
              });
            })(td, schedules.join('\n'));
          }

          date++;
        }
        tr.appendChild(td);
      }

      tbody.appendChild(tr);
      // 6行目で当月の日が含まれなければ描画しない
      if (row === 5 && !hasCurrentMonth) break;
      if (date > lastDate && row >= 4) break;
    }

    // 今日の日付ラベル（当月以外なら当月へ戻るボタンを表示）
    const todayLabelEl = document.getElementById('today-label');
    const isCurrentMonth = (viewYear === todayY && viewMonth === todayM);
    if (isCurrentMonth) {
      todayLabelEl.innerHTML = '';
      todayLabelEl.textContent = '今日: ' + todayY + '年' + (todayM + 1) + '月' + todayD + '日';
    } else {
      const btn = document.createElement('button');
      btn.textContent = '今日: ' + todayY + '年' + (todayM + 1) + '月' + todayD + '日';
      btn.addEventListener('click', function() {
        viewYear  = todayY;
        viewMonth = todayM;
        render();
      });
      todayLabelEl.innerHTML = '';
      todayLabelEl.appendChild(btn);
    }
  }

  // クリックでツールチップを閉じる
  document.addEventListener('click', hideTooltip);

  document.getElementById('prev').addEventListener('click', function() {
    viewMonth--;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    render();
  });

  document.getElementById('next').addEventListener('click', function() {
    viewMonth++;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    render();
  });

  // スワイプナビゲーション（右スワイプ→翌月、左スワイプ→先月）
  let touchStartX = 0;
  const calendarEl = document.querySelector('.calendar');

  calendarEl.addEventListener('touchstart', function(e) {
    touchStartX = e.touches[0].clientX;
  }, { passive: true });

  calendarEl.addEventListener('touchend', function(e) {
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 50) {
      if (dx > 0) {
        // 右スワイプ → 翌月
        viewMonth++;
        if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      } else {
        // 左スワイプ → 先月
        viewMonth--;
        if (viewMonth < 0) { viewMonth = 11; viewYear--; }
      }
      render();
    }
  }, { passive: true });

  loadSchedule();
</script>
</body>
</html>
