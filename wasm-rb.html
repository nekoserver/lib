<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Ruby Browser Playground</title>
    <script src="https://cdn.jsdelivr.net/npm/@ruby/wasm-wasi@latest/dist/browser.script.iife.js"></script>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f4f4f9; }
        textarea { width: 100%; height: 150px; font-family: monospace; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { margin-top: 10px; padding: 10px 20px; background: #CC342D; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #9b221b; }
        #output { margin-top: 20px; padding: 15px; background: #222; color: #0f0; border-radius: 4px; min-height: 50px; white-space: pre-wrap; }
        .label { font-weight: bold; margin-bottom: 5px; display: block; }
    </style>
</head>
<body>

    <h2>Ruby Browser Editor</h2>
    
    <span class="label">Rubyコードを入力:</span>
    <textarea id="code">
def greet(name)
  "Hello, #{name}! The time is #{Time.now}."
end

puts greet("Rubyist")
puts "1 + 2 = #{1 + 2}"
    </textarea>

    <button onclick="runRuby()">コードを実行する</button>

    <span class="label" style="margin-top: 20px;">出力結果:</span>
    <div id="output">ここに結果が表示されます...</div>

    <script>
        // Rubyのインスタンスを保持する変数
        let vm;

        // 初期化処理
        async function init() {
            const response = await fetch("https://cdn.jsdelivr.net/npm/@ruby/3.3-wasm-wasi@latest/dist/ruby.wasm");
            const buffer = await response.arrayBuffer();
            const module = await WebAssembly.compile(buffer);
            const { instance } = await rubywasm.instantiateRuby(module);
            vm = instance;
            document.getElementById('output').innerText = "Ruby準備完了！";
        }

        async function runRuby() {
            if (!vm) {
                alert("Rubyを読み込み中です。少々お待ちください。");
                return;
            }
            
            const code = document.getElementById('code').value;
            const outputDiv = document.getElementById('output');
            
            try {
                // puts などの出力をキャプチャするために $stdout を再定義するテクニックもありますが、
                // 今回は eval の戻り値を表示するか、JS側への出力を利用します。
                const result = vm.eval(code);
                outputDiv.innerText = result.toString();
            } catch (e) {
                outputDiv.innerText = "エラー: " + e.message;
            }
        }

        init();
    </script>
</body>
</html>
