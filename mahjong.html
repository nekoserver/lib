<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麻雀 四人打ち 配牌表示</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    background: #1a5c2a;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  h1 {
    font-size: 1.5rem;
    margin-bottom: 18px;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
  }

  button#deal-btn {
    margin-bottom: 20px;
    padding: 10px 30px;
    font-size: 1.1rem;
    border: none;
    border-radius: 8px;
    background: #c0392b;
    color: #fff;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 3px 8px rgba(0,0,0,0.3);
    transition: background 0.15s;
  }
  button#deal-btn:hover { background: #e74c3c; }

  .player-section {
    background: rgba(0,0,0,0.3);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 14px;
    width: 100%;
    max-width: 960px;
  }

  .player-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }

  .wind-badge {
    font-size: 1.4em;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-weight: bold;
    flex-shrink: 0;
  }
  .wind-east  { background: #c62828; color: #fff; }
  .wind-south { background: #1565c0; color: #fff; }
  .wind-west  { background: #2e7d32; color: #fff; }
  .wind-north { background: #4a148c; color: #fff; }

  .player-info { flex: 1; }
  .player-name { font-size: 1.1em; font-weight: bold; }
  .shanten-info {
    font-size: 0.9rem;
    color: #ffd700;
    font-weight: bold;
    margin-top: 2px;
  }
  .shanten-details {
    font-size: 0.75rem;
    color: #ccc;
    margin-top: 3px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .form-best {
    color: #ffd700;
    font-weight: bold;
  }
  .form-other {
    color: #999;
  }

  .hand-status {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 5px;
  }
  .status-badge {
    font-size: 0.8rem;
    padding: 2px 10px;
    border-radius: 4px;
    font-weight: bold;
  }
  .badge-tenhou { background: #ff6f00; color: #fff; }
  .badge-agari  { background: #c62828; color: #fff; }
  .badge-kyuushu { background: #1565c0; color: #fff; }
  .badge-shisan  { background: #6a1b9a; color: #fff; }
  .badge-ankan   { background: #2e7d32; color: #fff; }

  .hand {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    flex-wrap: nowrap;
    overflow-x: auto;
  }

  .tile-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
  }
  .tile-wrap.tsumo-wrap {
    margin-left: 14px;
  }

  .tile {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 50px;
    height: 70px;
    background: #fffde7;
    border-radius: 6px;
    border: 1px solid #bfa060;
    font-size: 2.0em;
    cursor: default;
    user-select: none;
    box-shadow: 1px 2px 4px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.8);
    transition: transform 0.1s;
  }
  .tile:hover { transform: translateY(-4px); }

  .tile.tsumo {
    border-color: #f9a825;
    box-shadow: 1px 2px 6px rgba(249,168,37,0.7), inset 0 1px 0 rgba(255,255,255,0.8);
  }

  .suit-man   { color: #b71c1c; }
  .suit-pin   { color: #0d47a1; }
  .suit-sou   { color: #1b5e20; }
  .suit-honor { color: #212121; }
  .suit-chun  { color: #b71c1c; }
  .suit-hatsu { color: #1b5e20; }

  .tile-label {
    font-size: 0.6em;
    color: #aaa;
    text-align: center;
    margin-top: 3px;
    white-space: nowrap;
  }
</style>
</head>
<body>

<h1>麻雀 四人打ち 配牌</h1>
<button id="deal-btn">配牌する</button>
<div id="players"></div>

<script>
// ─── 牌定義（花牌なし・136枚）──────────────────────────
// index 0-8: 萬子(1m-9m), 9-17: 筒子(1p-9p), 18-26: 索子(1s-9s)
// 27:東 28:南 29:西 30:北 31:白 32:發 33:中

const TILE_DEFS = [
  { cp: 0x1F007, name: '一萬', suit: 'man',   sortKey: 10 },
  { cp: 0x1F008, name: '二萬', suit: 'man',   sortKey: 11 },
  { cp: 0x1F009, name: '三萬', suit: 'man',   sortKey: 12 },
  { cp: 0x1F00A, name: '四萬', suit: 'man',   sortKey: 13 },
  { cp: 0x1F00B, name: '五萬', suit: 'man',   sortKey: 14 },
  { cp: 0x1F00C, name: '六萬', suit: 'man',   sortKey: 15 },
  { cp: 0x1F00D, name: '七萬', suit: 'man',   sortKey: 16 },
  { cp: 0x1F00E, name: '八萬', suit: 'man',   sortKey: 17 },
  { cp: 0x1F00F, name: '九萬', suit: 'man',   sortKey: 18 },
  { cp: 0x1F019, name: '一筒', suit: 'pin',   sortKey: 20 },
  { cp: 0x1F01A, name: '二筒', suit: 'pin',   sortKey: 21 },
  { cp: 0x1F01B, name: '三筒', suit: 'pin',   sortKey: 22 },
  { cp: 0x1F01C, name: '四筒', suit: 'pin',   sortKey: 23 },
  { cp: 0x1F01D, name: '五筒', suit: 'pin',   sortKey: 24 },
  { cp: 0x1F01E, name: '六筒', suit: 'pin',   sortKey: 25 },
  { cp: 0x1F01F, name: '七筒', suit: 'pin',   sortKey: 26 },
  { cp: 0x1F020, name: '八筒', suit: 'pin',   sortKey: 27 },
  { cp: 0x1F021, name: '九筒', suit: 'pin',   sortKey: 28 },
  { cp: 0x1F010, name: '一索', suit: 'sou',   sortKey: 30 },
  { cp: 0x1F011, name: '二索', suit: 'sou',   sortKey: 31 },
  { cp: 0x1F012, name: '三索', suit: 'sou',   sortKey: 32 },
  { cp: 0x1F013, name: '四索', suit: 'sou',   sortKey: 33 },
  { cp: 0x1F014, name: '五索', suit: 'sou',   sortKey: 34 },
  { cp: 0x1F015, name: '六索', suit: 'sou',   sortKey: 35 },
  { cp: 0x1F016, name: '七索', suit: 'sou',   sortKey: 36 },
  { cp: 0x1F017, name: '八索', suit: 'sou',   sortKey: 37 },
  { cp: 0x1F018, name: '九索', suit: 'sou',   sortKey: 38 },
  { cp: 0x1F000, name: '東',   suit: 'honor', sortKey: 40 },
  { cp: 0x1F001, name: '南',   suit: 'honor', sortKey: 41 },
  { cp: 0x1F002, name: '西',   suit: 'honor', sortKey: 42 },
  { cp: 0x1F003, name: '北',   suit: 'honor', sortKey: 43 },
  { cp: 0x1F006, name: '白',   suit: 'honor', sortKey: 44 },
  { cp: 0x1F005, name: '發',   suit: 'hatsu', sortKey: 45 },
  { cp: 0x1F004, name: '中',   suit: 'chun',  sortKey: 46 },
];

// sortKeyから牌index(0-33)へ変換テーブル
const SORTKEY_TO_INDEX = {};
TILE_DEFS.forEach((d, i) => { SORTKEY_TO_INDEX[d.sortKey] = i; });

function tileDefIndex(tile) {
  return TILE_DEFS.findIndex(d => d.sortKey === tile.sortKey);
}

// ─── 山牌生成 ────────────────────────────────────────
function buildWall() {
  const wall = [];
  for (const def of TILE_DEFS) {
    for (let i = 0; i < 4; i++) wall.push({ ...def });
  }
  return wall;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ─── 配牌（全員14枚）────────────────────────────────────
function dealHands(wall) {
  const hands = [[], [], [], []];
  let idx = 0;

  // 4枚×3巡
  for (let round = 0; round < 3; round++) {
    for (let p = 0; p < 4; p++) {
      for (let t = 0; t < 4; t++) hands[p].push(wall[idx++]);
    }
  }
  // 1枚ずつ
  for (let p = 0; p < 4; p++) hands[p].push(wall[idx++]);
  // 全員にツモ牌（14枚目）
  for (let p = 0; p < 4; p++) {
    const tsumo = wall[idx++];
    tsumo.isTsumo = true;
    hands[p].push(tsumo);
  }
  return hands;
}

// ─── ソート（ツモ牌を除いた13枚をソート）────────────────
function sortHand(hand) {
  const main = hand.filter(t => !t.isTsumo).sort((a, b) => a.sortKey - b.sortKey);
  const tsumo = hand.find(t => t.isTsumo);
  return { main, tsumo };
}

// ─── 向聴数計算 ──────────────────────────────────────
// 手牌を34種のカウント配列に変換
function handToCounts(hand) {
  const counts = new Array(34).fill(0);
  for (const tile of hand) {
    const idx = tileDefIndex(tile);
    if (idx >= 0) counts[idx]++;
  }
  return counts;
}

// 通常手の向聴数
function calcShantenNormal(countsOrig) {
  const counts = countsOrig.slice();
  let minShanten = 8;

  function search(mentsu, partial, idx, hasHead) {
    if (mentsu + partial > 4) return;
    const sh = hasHead ? (8 - mentsu * 2 - partial - 1) : (8 - mentsu * 2 - partial);
    if (sh < minShanten) minShanten = sh;
    if (idx >= 34) return;

    // 次の牌があるインデックスまでスキップ
    while (idx < 34 && counts[idx] === 0) idx++;
    if (idx >= 34) return;

    // 刻子
    if (counts[idx] >= 3) {
      counts[idx] -= 3;
      search(mentsu + 1, partial, idx, hasHead);
      counts[idx] += 3;
    }

    // 順子（数牌のみ: 0-6, 9-15, 18-24）
    if (idx < 27 && idx % 9 <= 6 && counts[idx + 1] >= 1 && counts[idx + 2] >= 1) {
      counts[idx]--; counts[idx+1]--; counts[idx+2]--;
      search(mentsu + 1, partial, idx, hasHead);
      counts[idx]++; counts[idx+1]++; counts[idx+2]++;
    }

    // 雀頭
    if (!hasHead && counts[idx] >= 2) {
      counts[idx] -= 2;
      search(mentsu, partial, idx, true);
      counts[idx] += 2;
    }

    // 対子ターツ
    if (counts[idx] >= 2) {
      counts[idx] -= 2;
      search(mentsu, partial + 1, idx, hasHead);
      counts[idx] += 2;
    }

    // 両面・辺張ターツ
    if (idx < 27 && idx % 9 <= 7 && counts[idx + 1] >= 1) {
      counts[idx]--; counts[idx+1]--;
      search(mentsu, partial + 1, idx + 1, hasHead);
      counts[idx]++; counts[idx+1]++;
    }

    // 嵌張ターツ
    if (idx < 27 && idx % 9 <= 6 && counts[idx + 2] >= 1) {
      counts[idx]--; counts[idx+2]--;
      search(mentsu, partial + 1, idx + 1, hasHead);
      counts[idx]++; counts[idx+2]++;
    }

    // この牌を使わない
    search(mentsu, partial, idx + 1, hasHead);
  }

  search(0, 0, 0, false);
  return minShanten;
}

// 七対子
function calcShantenChiitoi(counts) {
  let pairs = 0;
  let kinds = 0;
  for (let i = 0; i < 34; i++) {
    if (counts[i] >= 1) kinds++;
    if (counts[i] >= 2) pairs++;
  }
  let shanten = 6 - pairs;
  if (kinds < 7) shanten += (7 - kinds);
  return shanten;
}

// 国士無双
function calcShantenKokushi(counts) {
  const yaochu = [0,8,9,17,18,26,27,28,29,30,31,32,33];
  let found = 0;
  let hasPair = false;
  for (const t of yaochu) {
    if (counts[t] >= 1) found++;
    if (counts[t] >= 2) hasPair = true;
  }
  return 13 - found - (hasPair ? 1 : 0);
}

function calcShanten(hand) {
  const counts = handToCounts(hand);
  const normal = calcShantenNormal(counts);
  const chiitoi = calcShantenChiitoi(counts);
  const kokushi = calcShantenKokushi(counts);
  const min = Math.min(normal, chiitoi, kokushi);
  return { min, normal, chiitoi, kokushi };
}

function shantenLabel(s) {
  if (s <= -1) return '和了';
  if (s === 0) return 'テンパイ';
  return s + '向聴';
}

function shantenText(result) {
  const { min, normal, chiitoi, kokushi } = result;
  const mainText = (min <= -1) ? '和了（アガリ形）' : (min === 0) ? 'テンパイ' : min + '向聴';

  const forms = [
    { name: '通常形', value: normal },
    { name: '七対子', value: chiitoi },
    { name: '国士無双', value: kokushi },
  ];

  const details = forms.map(f => {
    const isBest = (f.value === min);
    const label = shantenLabel(f.value);
    return isBest
      ? `<span class="form-best">${f.name}: ${label}</span>`
      : `<span class="form-other">${f.name}: ${label}</span>`;
  }).join('  ');

  return { mainText, details };
}

// ─── 特殊判定 ────────────────────────────────────────

// 十三不塔: 手牌14枚中ちょうど1組の対子があり、
// 残り12枚が全て孤立牌（互いに面子・ターツを構成しない）
function isShisanBudah(hand) {
  const counts = handToCounts(hand);
  let pairCount = 0;
  let pairIdx = -1;
  for (let i = 0; i < 34; i++) {
    if (counts[i] >= 3) return false;
    if (counts[i] === 2) {
      pairCount++;
      pairIdx = i;
    }
  }
  if (pairCount !== 1) return false;

  // 対子を除いた残り12枚が全て孤立しているか確認
  counts[pairIdx] -= 2;
  for (let i = 0; i < 34; i++) {
    if (counts[i] === 0) continue;
    // 数牌は同種内で隣接2枚以内にあればターツを構成する
    if (i < 27) {
      if (i % 9 <= 7 && counts[i + 1] >= 1) return false;
      if (i % 9 <= 6 && counts[i + 2] >= 1) return false;
    }
  }
  return true;
}

// 九種九牌: 手牌にヤオチュウ牌（老頭牌＋字牌）が9種類以上
function isKyuushuKyuuhai(hand) {
  const counts = handToCounts(hand);
  const yaochu = [0,8,9,17,18,26,27,28,29,30,31,32,33];
  let kinds = 0;
  for (const t of yaochu) {
    if (counts[t] >= 1) kinds++;
  }
  return kinds >= 9;
}

// 暗槓可能: 手牌14枚中に同一牌が4枚揃っている
function findAnkan(hand) {
  const counts = handToCounts(hand);
  const result = [];
  for (let i = 0; i < 34; i++) {
    if (counts[i] === 4) {
      result.push(TILE_DEFS[i].name);
    }
  }
  return result;
}

// ─── レンダリング ────────────────────────────────────
function codePointToChar(cp) {
  return String.fromCodePoint(cp);
}

function renderHand(hand) {
  const { main, tsumo } = sortHand(hand);
  let html = '';

  for (const tile of main) {
    const suitClass = `suit-${tile.suit}`;
    html += `<div class="tile-wrap">
      <div class="tile ${suitClass}" title="${tile.name}">${codePointToChar(tile.cp)}</div>
      <div class="tile-label">${tile.name}</div>
    </div>`;
  }

  // ツモ牌（常に最右に間隔を空けて表示）
  if (tsumo) {
    const suitClass = `suit-${tsumo.suit}`;
    html += `<div class="tile-wrap tsumo-wrap">
      <div class="tile tsumo ${suitClass}" title="${tsumo.name}（ツモ）">${codePointToChar(tsumo.cp)}</div>
      <div class="tile-label">${tsumo.name}</div>
    </div>`;
  }

  return html;
}

const PLAYERS = [
  { wind: '東', label: '東家（親）', badge: 'east' },
  { wind: '南', label: '南家',       badge: 'south' },
  { wind: '西', label: '西家',       badge: 'west' },
  { wind: '北', label: '北家',       badge: 'north' },
];

function deal() {
  const wall = shuffle(buildWall());
  const hands = dealHands(wall);
  const container = document.getElementById('players');
  container.innerHTML = '';

  for (let p = 0; p < 4; p++) {
    const info = PLAYERS[p];
    const result = calcShanten(hands[p]);
    const { mainText, details } = shantenText(result);

    // 特殊判定
    const isDealer = (p === 0);
    const agari = (result.min <= -1);
    let statusHtml = '';

    // 和了判定 → 親なら天和
    if (agari && isDealer) {
      statusHtml += '<span class="status-badge badge-tenhou">天和</span>';
    } else if (agari) {
      statusHtml += '<span class="status-badge badge-agari">和了</span>';
    }

    // 十三不塔
    if (isShisanBudah(hands[p])) {
      statusHtml += '<span class="status-badge badge-shisan">十三不塔</span>';
    }

    // 九種九牌
    if (isKyuushuKyuuhai(hands[p])) {
      statusHtml += '<span class="status-badge badge-kyuushu">九種九牌</span>';
    }

    // 暗槓可能
    const ankanTiles = findAnkan(hands[p]);
    if (ankanTiles.length > 0) {
      statusHtml += `<span class="status-badge badge-ankan">暗槓可能: ${ankanTiles.join(', ')}</span>`;
    }

    const statusDiv = statusHtml ? `<div class="hand-status">${statusHtml}</div>` : '';

    container.innerHTML += `
      <div class="player-section">
        <div class="player-header">
          <div class="wind-badge wind-${info.badge}">${info.wind}</div>
          <div class="player-info">
            <div class="player-name">${info.label}（14枚）</div>
            <div class="shanten-info">${mainText}</div>
            <div class="shanten-details">${details}</div>
            ${statusDiv}
          </div>
        </div>
        <div class="hand">${renderHand(hands[p])}</div>
      </div>`;
  }
}

// ─── イベント ──────────────────────────────────────
document.getElementById('deal-btn').addEventListener('click', deal);
deal();
</script>
</body>
</html>
