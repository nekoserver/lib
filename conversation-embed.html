<!doctype html>
<html lang="ja" data-embed="conversation">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>このCodex会話</title>
  <link rel="stylesheet" href="chat/style-streams-6a4c2f3c.css">
  <link rel="stylesheet" href="chat/embed-73704ae1c7cf.css">
  <script type="module" src="chat/app-ba2150f4daed.mjs"></script>
</head>
<body>
<main>
  <h1>AIチャット</h1>
  <p class="subtitle">通信方式を切り替えて、イベントの届き方を比べられます。</p>
  <section>
    <form id="form">
      <label for="source">表示するもの</label>
      <select id="source">
        <option value="conversation">この会話（閲覧のみ）</option>
        <option value="ai">別のAI実行</option>
      </select>
      <label for="protocol">通信方式</label>
      <select id="protocol" aria-describedby="protocol-hint">
        <option value="sse">SSE（Server-Sent Events）</option>
        <option value="websocket">WebSocket</option>
        <option value="ndjson">NDJSON（HTTPストリーム）</option>
        <option value="jsonseq">JSON Text Sequence（RFC 7464）</option>
      </select>
      <p id="protocol-hint" class="hint"></p>
      <label for="secret">HMACキー</label>
      <input id="secret" type="password" autocomplete="off" spellcheck="false" aria-describedby="key-hint">
      <p id="key-hint" class="hint">既存の認証キーを入力してください。最初の接続時だけ入力してください。認証後は入力欄が非表示になります。</p>
      <div id="ai-fields" hidden>
        <label for="engine">AI</label>
        <select id="engine"><option value="codex">Codex</option><option value="claude">Claude</option></select>
        <label for="prompt">メッセージ（この会話には送信されません）</label>
        <textarea id="prompt" placeholder="別のAI実行への質問を入力してください"></textarea>
      </div>
      <div class="actions">
        <button id="send" type="submit">表示を開始</button>
        <button id="demo" class="secondary" type="button">比較デモ（キー不要）</button>
        <button id="resume" class="secondary" type="button" disabled>結果に再接続</button>
        <button id="stop" class="secondary" type="button" disabled>受信を停止</button>
      </div>
    </form>
  </section>
  <section aria-label="回答">
    <p id="status" role="status" aria-live="polite">未接続</p>
    <p id="job"></p>
    <p id="metadata"></p>
    <p id="delivery" class="hint"></p>
    <p id="stats" class="hint"></p>
    <p id="activity" class="hint"></p>
    <div id="conversation" hidden></div>
    <div id="answer" class="markdown"></div>
    <details>
      <summary>受信イベントを見る（最新60件）</summary>
      <pre id="events" class="event-log"></pre>
    </details>
  </section>
  <section id="console-section" hidden aria-label="このコンソールに入力">
    <form id="console-form">
      <label for="console-prompt">このCodexコンソールにメッセージを送信</label>
      <textarea id="console-prompt" maxlength="16384" rows="3" placeholder="この会話に直接入力"></textarea>
      <div id="console-key-row">
        <label for="console-key">送信を許可する既存HMACキー</label>
        <input id="console-key" type="password" autocomplete="off" spellcheck="false">
        <p class="hint">キーは送信を許可する時だけ使い、保存しません。</p>
      </div>
      <div class="actions">
        <button id="console-send" type="submit">このコンソールに送信</button>
        <button id="console-revoke" class="secondary" type="button" hidden>送信許可を解除</button>
      </div>
      <p id="console-status" role="status" aria-live="polite"></p>
    </form>
  </section>
</main>
</body>
</html>
