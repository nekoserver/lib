<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIチャット — WebSocket</title>
  <link rel="stylesheet" href="chat/style-markdown.css">
  <script type="module" src="chat/app.mjs?v=markdown1"></script>
</head>
<body>
<main>
  <h1>AIチャット</h1>
  <p class="subtitle">WebSocketで実行状態と回答を受信します。</p>
  <section>
    <form id="form">
      <label for="engine">AI</label>
      <select id="engine"><option value="codex">Codex</option><option value="claude">Claude</option></select>
      <label for="secret">HMACキー</label>
      <input id="secret" type="password" autocomplete="off" spellcheck="false" aria-describedby="key-hint">
      <p id="key-hint" class="hint">既存の認証キーを入力してください。キーは保存せず、接続時に入力欄から消去します。</p>
      <label for="prompt">メッセージ</label>
      <textarea id="prompt" placeholder="質問を入力してください"></textarea>
      <div class="actions">
        <button id="send" type="submit">送信</button>
        <button id="resume" class="secondary" type="button" disabled>結果に再接続</button>
        <button id="stop" class="secondary" type="button" disabled>受信を停止</button>
      </div>
      <p class="hint">受信を停止してもAIの実行は続きます。再接続時はキーを再入力してください。回答は生成完了時に表示されます。</p>
    </form>
  </section>
  <section aria-label="回答">
    <p id="status" role="status" aria-live="polite">未接続</p>
    <p id="job"></p>
    <p id="metadata"></p>
    <div id="answer"></div>
  </section>
</main>
</body>
</html>
