<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FastAPI 非ストリーミング サンプル</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container { max-width: 960px; margin: 0 auto; }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 600;
      color: #f8fafc;
      margin-bottom: 0.5rem;
      letter-spacing: 0.02em;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 0.85rem;
      margin-bottom: 2rem;
    }

    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
      margin-bottom: 1.2rem;
    }

    @media (max-width: 700px) {
      .panels { grid-template-columns: 1fr; }
      .cascade-row { flex-direction: column; align-items: stretch !important; }
    }

    .panel {
      background: #1a1d2e;
      border: 1px solid #2a2d3e;
      border-radius: 10px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
    }

    .panel-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.8rem;
    }

    .code-block {
      background: #111322;
      border: 1px solid #2a2d3e;
      border-radius: 8px;
      padding: 1rem;
      overflow-x: auto;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 0.75rem;
      line-height: 1.7;
      color: #c9d1d9;
      flex: 1;
      tab-size: 4;
      max-height: 420px;
      overflow-y: auto;
    }

    .code-block::-webkit-scrollbar { width: 6px; height: 6px; }
    .code-block::-webkit-scrollbar-track { background: transparent; }
    .code-block::-webkit-scrollbar-thumb { background: #3a3d5e; border-radius: 3px; }

    .code-block .kw { color: #c678dd; }
    .code-block .fn { color: #61afef; }
    .code-block .str { color: #98c379; }
    .code-block .dec { color: #e5c07b; }
    .code-block .cmt { color: #5c6370; font-style: italic; }
    .code-block .num { color: #d19a66; }
    .code-block .op { color: #56b6c2; }
    .code-block .cls { color: #e5c07b; }

    .controls {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 1.2rem;
    }

    .controls label { font-size: 0.8rem; color: #94a3b8; }

    .controls select {
      background: #1a1d2e;
      border: 1px solid #2a2d3e;
      border-radius: 6px;
      color: #e2e8f0;
      padding: 0.45rem 0.7rem;
      font-size: 0.82rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .controls select:focus { border-color: #6366f1; }

    .btn {
      padding: 0.5rem 1.2rem;
      border: none;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:active { transform: scale(0.97); }
    .btn-primary { background: #6366f1; color: #fff; }
    .btn-primary:hover { background: #5558e6; }
    .btn-clear { background: #374151; color: #d1d5db; }
    .btn-clear:hover { background: #4b5563; }

    .method-badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      margin-right: 0.3rem;
    }

    .method-get { background: #064e3b; color: #6ee7b7; }
    .method-post { background: #1e3a5f; color: #93c5fd; }
    .method-put { background: #713f12; color: #fcd34d; }
    .method-delete { background: #7f1d1d; color: #fca5a5; }
    .method-patch { background: #4a1d6a; color: #d8b4fe; }

    .output-area {
      background: #111322;
      border: 1px solid #2a2d3e;
      border-radius: 10px;
      padding: 1rem;
      min-height: 160px;
      max-height: 480px;
      overflow-y: auto;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 0.8rem;
      line-height: 1.6;
    }

    .output-area::-webkit-scrollbar { width: 6px; }
    .output-area::-webkit-scrollbar-track { background: transparent; }
    .output-area::-webkit-scrollbar-thumb { background: #3a3d5e; border-radius: 3px; }

    .response-item { padding: 0.5rem 0.8rem; border-radius: 6px; margin-bottom: 0.5rem; animation: fadeIn 0.3s ease; word-break: break-all; }
    .response-item.request-line { background: #1a2332; border-left: 3px solid #6366f1; color: #a5b4fc; font-weight: 600; }
    .response-item.status-line { font-size: 0.75rem; color: #94a3b8; padding: 0.2rem 0.8rem; }
    .response-item.status-line .s2xx { color: #86efac; font-weight: 600; }
    .response-item.status-line .s4xx { color: #fca5a5; font-weight: 600; }
    .response-item.json-line { background: #151927; border-left: 3px solid #22c55e; }
    .response-item.error-line { background: #2d1b1b; border-left: 3px solid #ef4444; color: #fca5a5; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .json-key { color: #7dd3fc; }
    .json-str { color: #98c379; }
    .json-num { color: #d19a66; }
    .json-bool { color: #c678dd; }
    .json-null { color: #5c6370; }
    .json-brace { color: #abb2bf; }

    .status-bar { display: flex; align-items: center; gap: 0.8rem; margin-top: 0.8rem; font-size: 0.78rem; color: #64748b; }
    .stats { margin-left: auto; display: flex; gap: 1rem; }
    .stats span { color: #94a3b8; }
    .stats strong { color: #e2e8f0; }

    .tab-bar { display: flex; gap: 0.3rem; margin-bottom: 1rem; }
    .tab-btn {
      padding: 0.4rem 1rem;
      border: 1px solid #2a2d3e;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      background: #1a1d2e;
      color: #94a3b8;
      font-size: 0.78rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .tab-btn.active { background: #111322; color: #e2e8f0; border-color: #6366f1; border-bottom: 1px solid #111322; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .body-input-area { margin-bottom: 1.2rem; display: none; }
    .body-input-area.visible { display: block; }
    .body-input-area textarea {
      width: 100%;
      background: #1a1d2e;
      border: 1px solid #2a2d3e;
      border-radius: 8px;
      color: #e2e8f0;
      padding: 0.8rem;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 0.8rem;
      line-height: 1.6;
      resize: vertical;
      min-height: 80px;
      outline: none;
      transition: border-color 0.2s;
    }
    .body-input-area textarea:focus { border-color: #6366f1; }
    .body-input-area textarea.readonly-mode { opacity: 0.7; cursor: default; }

    .body-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.4rem; flex-wrap: wrap; }
    .body-header .body-label { font-size: 0.78rem; color: #94a3b8; }

    .btn-sm {
      padding: 0.2rem 0.6rem;
      border: 1px solid #2a2d3e;
      border-radius: 4px;
      background: #1a1d2e;
      color: #94a3b8;
      font-size: 0.72rem;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 600;
    }
    .btn-sm:hover { background: #2a2d3e; color: #e2e8f0; }
    .btn-sm.btn-toggle-active { background: #6366f1; color: #fff; border-color: #6366f1; }
    .btn-sm.btn-edit-active { background: #059669; color: #fff; border-color: #059669; }

    .body-content { transition: max-height 0.3s ease, opacity 0.3s ease; overflow: hidden; }
    .body-content.collapsed { max-height: 0; opacity: 0; margin: 0; }
    .body-content.expanded { max-height: 500px; opacity: 1; }

    .validation-errors { background: #2d1b1b; border: 1px solid #ef4444; border-radius: 6px; padding: 0.6rem 0.8rem; margin-top: 0.4rem; font-size: 0.75rem; color: #fca5a5; display: none; }
    .validation-errors.visible { display: block; }
    .validation-errors ul { list-style: none; padding: 0; }
    .validation-errors li::before { content: "! "; font-weight: 700; color: #ef4444; }

    .endpoint-info { background: #1a1d2e; border: 1px solid #2a2d3e; border-radius: 8px; padding: 0.6rem 1rem; margin-bottom: 1.2rem; font-size: 0.8rem; color: #94a3b8; }
    .endpoint-info .endpoint-path { color: #e2e8f0; font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-weight: 600; }
    .endpoint-info .endpoint-desc { margin-top: 0.3rem; font-size: 0.75rem; }

    .code-snippet-section { margin-bottom: 1.2rem; }
    .code-snippet-toggle { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.8rem; }
    .code-snippet-toggle .toggle-label { font-size: 0.8rem; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; }
    .code-panels-wrapper { transition: max-height 0.4s ease, opacity 0.3s ease; overflow: hidden; }
    .code-panels-wrapper.collapsed { max-height: 0; opacity: 0; }
    .code-panels-wrapper.expanded { max-height: 2000px; opacity: 1; }

    .edit-controls { display: flex; gap: 0.4rem; margin-left: auto; }

    /* --- Cascade Menu --- */
    .cascade-row {
      display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center;
      margin-bottom: 0.8rem; padding: 0.6rem 0.8rem;
      background: #1a1d2e; border: 1px solid #2a2d3e; border-radius: 8px;
    }
    .cascade-row label { font-size: 0.78rem; color: #94a3b8; white-space: nowrap; }
    .cascade-row select {
      background: #111322; border: 1px solid #2a2d3e; border-radius: 6px;
      color: #e2e8f0; padding: 0.4rem 0.6rem; font-size: 0.8rem;
      font-family: inherit; outline: none; transition: border-color 0.2s; min-width: 120px;
    }
    .cascade-row select:focus { border-color: #6366f1; }
    .cascade-separator { color: #374151; font-size: 1.1rem; user-select: none; }

    /* --- KV Panel --- */
    .kv-section { margin-top: 1rem; }
    .kv-toggle-bar { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.6rem; }
    .kv-toggle-bar .kv-label { font-size: 0.78rem; font-weight: 600; color: #94a3b8; }
    .kv-panel-wrapper { transition: max-height 0.3s ease, opacity 0.3s ease; overflow: hidden; }
    .kv-panel-wrapper.collapsed { max-height: 0; opacity: 0; }
    .kv-panel-wrapper.expanded { max-height: 2000px; opacity: 1; }
    .kv-panel {
      background: #111322; border: 1px solid #2a2d3e; border-radius: 10px;
      padding: 0.8rem; max-height: 400px; overflow-y: auto;
    }
    .kv-panel::-webkit-scrollbar { width: 6px; }
    .kv-panel::-webkit-scrollbar-track { background: transparent; }
    .kv-panel::-webkit-scrollbar-thumb { background: #3a3d5e; border-radius: 3px; }
    .kv-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .kv-table thead th { background: #1e2330; color: #94a3b8; text-align: left; padding: 0.45rem 0.7rem; border-bottom: 1px solid #2d3748; font-weight: 500; font-size: 0.75rem; }
    .kv-table tbody tr { border-bottom: 1px solid #1e2330; }
    .kv-table tbody tr:hover { background: #1e2330; }
    .kv-table tbody td { padding: 0.45rem 0.7rem; vertical-align: top; word-break: break-all; }
    .kv-key-cell { color: #a5b4fc; font-family: monospace; font-size: 0.78rem; }
    .kv-val-cell { color: #86efac; font-family: monospace; font-size: 0.78rem; }
    .kv-type-badge { display: inline-block; font-size: 0.65rem; padding: 0.08rem 0.35rem; border-radius: 4px; font-weight: 600; letter-spacing: 0.03em; }
    .kv-t-string  { background: #164e63; color: #67e8f9; }
    .kv-t-number  { background: #14532d; color: #86efac; }
    .kv-t-boolean { background: #3b1f6b; color: #c4b5fd; }
    .kv-t-null    { background: #374151; color: #9ca3af; }
    .kv-t-object  { background: #1c2a4a; color: #93c5fd; }
    .kv-t-array   { background: #2a1a0e; color: #fdba74; }
    .kv-empty-msg { color: #4b5563; font-size: 0.8rem; text-align: center; padding: 1.5rem 0; }
    .kv-count { font-size: 0.72rem; color: #64748b; margin-bottom: 0.4rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>FastAPI 非ストリーミング サンプル</h1>
    <p class="subtitle">通常のJSON レスポンスを返すREST API デモ（フロントエンドシミュレーション）</p>

    <!-- Code Snippet Section (collapsible) - ABOVE controls -->
    <div class="code-snippet-section">
      <div class="code-snippet-toggle">
        <span class="toggle-label">コードスニペット</span>
        <button class="btn-sm" id="btn-toggle-code">展開する</button>
      </div>
      <div class="code-panels-wrapper collapsed" id="code-panels-wrapper">
        <div class="panels">
          <div class="panel">
            <div class="panel-title">Server（FastAPI）</div>
            <div class="code-block" id="server-code"></div>
          </div>
          <div class="panel">
            <div class="panel-title">Client（JavaScript）</div>
            <div class="code-block" id="client-code"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Cascade Menu -->
    <div class="cascade-row">
      <label>カテゴリ:</label>
      <select id="category-select"></select>
      <span class="cascade-separator">/</span>
      <label>操作:</label>
      <select id="action-select"></select>
    </div>

    <!-- Flat Controls (unchanged) -->
    <div class="controls">
      <label>エンドポイント:</label>
      <select id="endpoint-select"></select>
      <button class="btn btn-primary" id="btn-send">送信</button>
      <button class="btn btn-clear" id="btn-clear">クリア</button>
    </div>

    <!-- Endpoint Info -->
    <div class="endpoint-info" id="endpoint-info"></div>

    <!-- Request Body -->
    <div class="body-input-area" id="body-input-area">
      <div class="body-header">
        <span class="body-label">Request Body (JSON):</span>
        <button class="btn-sm" id="btn-toggle-body">閉じる</button>
        <div class="edit-controls">
          <button class="btn-sm" id="btn-edit-body">変更する</button>
          <button class="btn-sm" id="btn-reset-body">リセット</button>
        </div>
      </div>
      <div class="body-content expanded" id="body-content">
        <textarea id="request-body" spellcheck="false" readonly></textarea>
      </div>
      <div class="validation-errors" id="validation-errors">
        <ul id="validation-errors-list"></ul>
      </div>
    </div>

    <!-- Output Tabs -->
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="formatted">Formatted</button>
      <button class="tab-btn" data-tab="raw">Raw</button>
    </div>

    <div id="tab-formatted" class="tab-content active">
      <div class="output-area" id="output-formatted"></div>
    </div>
    <div id="tab-raw" class="tab-content">
      <div class="output-area" id="output-raw"></div>
    </div>

    <!-- KV Table Section -->
    <div class="kv-section">
      <div class="kv-toggle-bar">
        <span class="kv-label">レスポンス KV 一覧</span>
        <button class="btn-sm" id="btn-toggle-kv">展開する</button>
      </div>
      <div class="kv-panel-wrapper collapsed" id="kv-panel-wrapper">
        <div class="kv-panel" id="kv-panel">
          <p class="kv-empty-msg" id="kv-empty">レスポンスを送信するとキー/値の一覧が表示されます</p>
          <div id="kv-table-area"></div>
        </div>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
      <span id="status-text">待機中</span>
      <div class="stats">
        <span>リクエスト数: <strong id="stat-count">0</strong></span>
        <span>最終レスポンス: <strong id="stat-time">-</strong></span>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // Cookie helpers
    // ============================================================
    function setCookie(name, value, days) {
      const d = new Date();
      d.setTime(d.getTime() + (days || 365) * 24 * 60 * 60 * 1000);
      document.cookie = `${name}=${encodeURIComponent(value)};expires=${d.toUTCString()};path=/;SameSite=Lax`;
    }

    function getCookie(name) {
      const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
      return match ? decodeURIComponent(match[2]) : null;
    }

    // ============================================================
    // Categories
    // ============================================================
    const categories = [
      { id: 'users',     label: 'ユーザー (Users)',           desc: 'ID・一覧・作成・更新・削除' },
      { id: 'auth',      label: '認証 (Auth)',                desc: 'ログイン・ログアウト' },
      { id: 'protected', label: 'プロテクトページ (Protected)', desc: '自分の固有情報ほか' },
      { id: 'items',     label: '商品 (Items)',               desc: '検索ほか' },
      { id: 'orders',    label: '注文 (Orders)',              desc: '注文作成ほか' },
      { id: 'health',    label: 'ヘルスチェック (Health)',     desc: 'サービス状態' }
    ];

    // ============================================================
    // Endpoint definitions
    // ============================================================
    const endpoints = [
      {
        id: 'list_users',
        category: 'users',
        actionLabel: '一覧取得',
        method: 'GET',
        path: '/users',
        desc: 'ユーザー一覧を取得（クエリパラメータでページネーション）',
        hasBody: false,
        serverCode: `<span class="kw">from</span> fastapi <span class="kw">import</span> FastAPI, Query
<span class="kw">from</span> pydantic <span class="kw">import</span> BaseModel

app = <span class="fn">FastAPI</span>()

<span class="kw">class</span> <span class="cls">User</span>(<span class="cls">BaseModel</span>):
    id: <span class="dec">int</span>
    name: <span class="dec">str</span>
    email: <span class="dec">str</span>
    is_active: <span class="dec">bool</span> = <span class="num">True</span>

<span class="cmt"># 仮のデータベース</span>
fake_db: <span class="dec">list</span>[<span class="cls">User</span>] = [...]

<span class="dec">@app.get</span>(<span class="str">"/users"</span>)
<span class="kw">def</span> <span class="fn">list_users</span>(
    skip: <span class="dec">int</span> = <span class="fn">Query</span>(<span class="num">0</span>, ge=<span class="num">0</span>),
    limit: <span class="dec">int</span> = <span class="fn">Query</span>(<span class="num">10</span>, ge=<span class="num">1</span>, le=<span class="num">100</span>)
):
    users = fake_db[skip : skip + limit]
    <span class="kw">return</span> {
        <span class="str">"total"</span>: <span class="fn">len</span>(fake_db),
        <span class="str">"skip"</span>: skip,
        <span class="str">"limit"</span>: limit,
        <span class="str">"data"</span>: users
    }`,
        clientCode: `<span class="kw">const</span> response = <span class="kw">await</span> <span class="fn">fetch</span>(<span class="str">"/users?skip=0&limit=10"</span>);
<span class="kw">const</span> data = <span class="kw">await</span> response.<span class="fn">json</span>();

console.<span class="fn">log</span>(data.total);  <span class="cmt">// 総件数</span>
console.<span class="fn">log</span>(data.data);   <span class="cmt">// ユーザー配列</span>`,
        simulate() {
          const users = [];
          const names = ['田中太郎', '鈴木花子', '佐藤一郎', '高橋美咲', '伊藤健太'];
          for (let i = 0; i < names.length; i++) {
            users.push({
              id: i + 1,
              name: names[i],
              email: `${['tanaka', 'suzuki', 'sato', 'takahashi', 'ito'][i]}@example.com`,
              is_active: Math.random() > 0.2
            });
          }
          return { status: 200, body: { total: users.length, skip: 0, limit: 10, data: users } };
        }
      },
      {
        id: 'get_user',
        category: 'users',
        actionLabel: 'ID指定取得',
        method: 'GET',
        path: '/users/{user_id}',
        desc: 'パスパラメータで指定したユーザーを取得',
        hasBody: false,
        serverCode: `<span class="kw">from</span> fastapi <span class="kw">import</span> FastAPI, HTTPException

app = <span class="fn">FastAPI</span>()

<span class="dec">@app.get</span>(<span class="str">"/users/{user_id}"</span>)
<span class="kw">def</span> <span class="fn">get_user</span>(user_id: <span class="dec">int</span>):
    user = <span class="fn">find_user</span>(user_id)  <span class="cmt"># DB検索</span>
    <span class="kw">if</span> user <span class="kw">is</span> <span class="num">None</span>:
        <span class="kw">raise</span> <span class="fn">HTTPException</span>(
            status_code=<span class="num">404</span>,
            detail=<span class="str">f"User {user_id} not found"</span>
        )

<span class="kw">def</span> <span class="fn">create_order</span>(order: <span class="cls">OrderCreate</span>):
    result = <span class="fn">process_order</span>(order)
    <span class="kw">return</span> result`,
        clientCode: `<span class="kw">const</span> order = {
  items: [
    { product_id: <span class="num">1</span>, quantity: <span class="num">2</span> },
    { product_id: <span class="num">3</span>, quantity: <span class="num">1</span> }
  ],
  shipping_address: <span class="str">"東京都渋谷区1-2-3"</span>
};

<span class="kw">const</span> response = <span class="kw">await</span> <span class="fn">fetch</span>(<span class="str">"/orders"</span>, {
  method: <span class="str">"POST"</span>,
  headers: { <span class="str">"Content-Type"</span>: <span class="str">"application/json"</span> },
  body: JSON.<span class="fn">stringify</span>(order)
});

<span class="kw">if</span> (response.status === <span class="num">201</span>) {
  <span class="kw">const</span> result = <span class="kw">await</span> response.<span class="fn">json</span>();
  console.<span class="fn">log</span>(<span class="str">\`注文ID: \${result.order_id}\`</span>);
}`,
        simulate(body) {
          if (!body || !body.items || !body.items.length) return { status: 422, body: { detail: [{ loc: ["body", "items"], msg: "field required", type: "value_error.missing" }] } };
          const prices = { 1: 1500, 2: 2800, 3: 980, 4: 4200, 5: 650 };
          let total = 0;
          body.items.forEach(item => { total += (prices[item.product_id] || 1000) * item.quantity; });
          return { status: 201, body: { order_id: `ORD-${Date.now().toString(36).toUpperCase()}`, status: "pending", items: body.items, total_price: total, shipping_address: body.shipping_address || "未指定", created_at: new Date().toISOString() } };
        }
      },
      {
        id: 'health_check',
        category: 'health',
        actionLabel: '稼働状態確認',
        method: 'GET',
        path: '/health',
        desc: 'ヘルスチェック用エンドポイント（サービス稼働状態を確認）',
        hasBody: false,
        serverCode: `<span class="kw">from</span> fastapi <span class="kw">import</span> FastAPI
<span class="kw">from</span> datetime <span class="kw">import</span> datetime

app = <span class="fn">FastAPI</span>()

<span class="dec">@app.get</span>(<span class="str">"/health"</span>)
<span class="kw">def</span> <span class="fn">health_check</span>():
    <span class="kw">return</span> {
        <span class="str">"status"</span>: <span class="str">"healthy"</span>,
        <span class="str">"timestamp"</span>: datetime.<span class="fn">utcnow</span>().<span class="fn">isoformat</span>(),
        <span class="str">"version"</span>: <span class="str">"1.0.0"</span>,
        <span class="str">"services"</span>: { <span class="str">"database"</span>: <span class="str">"connected"</span>, <span class="str">"cache"</span>: <span class="str">"connected"</span> }
    }`,
        clientCode: `<span class="kw">const</span> response = <span class="kw">await</span> <span class="fn">fetch</span>(<span class="str">"/health"</span>);
<span class="kw">const</span> health = <span class="kw">await</span> response.<span class="fn">json</span>();

<span class="kw">if</span> (health.status === <span class="str">"healthy"</span>) {
  console.<span class="fn">log</span>(<span class="str">"サービス正常稼働中"</span>);
  console.<span class="fn">log</span>(<span class="str">\`バージョン: \${health.version}\`</span>);
} <span class="kw">else</span> {
  console.<span class="fn">error</span>(<span class="str">"サービス異常検出"</span>);
}`,
        simulate() {
          return { status: 200, body: { status: "healthy", timestamp: new Date().toISOString(), version: "1.0.0", services: { database: "connected", cache: "connected" } } };
        }
      }
    ];

    // ============================================================
    // DOM references
    // ============================================================
    const endpointSelect = document.getElementById('endpoint-select');
    const categorySelect = document.getElementById('category-select');
    const actionSelect = document.getElementById('action-select');
    const btnSend = document.getElementById('btn-send');
    const btnClear = document.getElementById('btn-clear');
    const outputFormatted = document.getElementById('output-formatted');
    const outputRaw = document.getElementById('output-raw');
    const statusText = document.getElementById('status-text');
    const statCount = document.getElementById('stat-count');
    const statTime = document.getElementById('stat-time');
    const serverCode = document.getElementById('server-code');
    const clientCode = document.getElementById('client-code');
    const endpointInfo = document.getElementById('endpoint-info');
    const bodyInputArea = document.getElementById('body-input-area');
    const requestBody = document.getElementById('request-body');
    const bodyContent = document.getElementById('body-content');
    const btnToggleBody = document.getElementById('btn-toggle-body');
    const btnEditBody = document.getElementById('btn-edit-body');
    const btnResetBody = document.getElementById('btn-reset-body');
    const btnToggleCode = document.getElementById('btn-toggle-code');
    const codePanelsWrapper = document.getElementById('code-panels-wrapper');
    const validationErrors = document.getElementById('validation-errors');
    const validationErrorsList = document.getElementById('validation-errors-list');
    const btnToggleKv = document.getElementById('btn-toggle-kv');
    const kvPanelWrapper = document.getElementById('kv-panel-wrapper');
    const kvTableArea = document.getElementById('kv-table-area');
    const kvEmpty = document.getElementById('kv-empty');

    let requestCount = 0;
    let isEditing = false;
    let lastResponseBody = null;

    // ============================================================
    // Populate flat endpoint select
    // ============================================================
    endpoints.forEach(ep => {
      const opt = document.createElement('option');
      opt.value = ep.id;
      opt.textContent = `${ep.method} ${ep.path}`;
      endpointSelect.appendChild(opt);
    });

    // ============================================================
    // Populate cascade: category select
    // ============================================================
    categories.forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat.id;
      opt.textContent = cat.label;
      categorySelect.appendChild(opt);
    });

    function populateActionSelect(catId) {
      actionSelect.innerHTML = '';
      const filtered = endpoints.filter(ep => ep.category === catId);
      filtered.forEach(ep => {
        const opt = document.createElement('option');
        opt.value = ep.id;
        opt.textContent = `${ep.method} ${ep.actionLabel}`;
        actionSelect.appendChild(opt);
      });
    }

    // Cascade: category change -> populate actions -> select first -> sync flat -> update
    categorySelect.addEventListener('change', () => {
      populateActionSelect(categorySelect.value);
      if (actionSelect.options.length > 0) {
        actionSelect.selectedIndex = 0;
        const epId = actionSelect.value;
        endpointSelect.value = epId;
        updateDisplay();
      }
    });

    // Cascade: action change -> sync flat -> update
    actionSelect.addEventListener('change', () => {
      endpointSelect.value = actionSelect.value;
      updateDisplay();
    });

    // Flat select change -> sync cascade -> update
    endpointSelect.addEventListener('change', () => {
      const ep = endpoints.find(e => e.id === endpointSelect.value);
      if (ep) {
        categorySelect.value = ep.category;
        populateActionSelect(ep.category);
        actionSelect.value = ep.id;
      }
      updateDisplay();
    });

    // ============================================================
    // JSON highlight
    // ============================================================
    function highlightJSON(obj, indent) {
      indent = indent || 0;
      const pad = '  '.repeat(indent);
      const padInner = '  '.repeat(indent + 1);

      if (obj === null) return '<span class="json-null">null</span>';
      if (typeof obj === 'boolean') return '<span class="json-bool">' + obj + '</span>';
      if (typeof obj === 'number') return '<span class="json-num">' + obj + '</span>';
      if (typeof obj === 'string') {
        var escaped = obj.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return '<span class="json-str">"' + escaped + '"</span>';
      }
      if (Array.isArray(obj)) {
        if (obj.length === 0) return '<span class="json-brace">[]</span>';
        var items = obj.map(function(v) { return padInner + highlightJSON(v, indent + 1); });
        return '<span class="json-brace">[</span>\n' + items.join(',\n') + '\n' + pad + '<span class="json-brace">]</span>';
      }
      var keys = Object.keys(obj);
      if (keys.length === 0) return '<span class="json-brace">{}</span>';
      var entries = keys.map(function(k) {
        return padInner + '<span class="json-key">"' + k + '"</span>: ' + highlightJSON(obj[k], indent + 1);
      });
      return '<span class="json-brace">{</span>\n' + entries.join(',\n') + '\n' + pad + '<span class="json-brace">}</span>';
    }

    function methodBadge(method) {
      return '<span class="method-badge method-' + method.toLowerCase() + '">' + method + '</span>';
    }

    // ============================================================
    // Toggle: body visibility (cookie)
    // ============================================================
    function getBodyExpanded() {
      var val = getCookie('bodyExpanded');
      return val === null ? true : val === 'true';
    }

    function setBodyExpanded(expanded) {
      setCookie('bodyExpanded', expanded ? 'true' : 'false');
      if (expanded) {
        bodyContent.classList.remove('collapsed');
        bodyContent.classList.add('expanded');
        btnToggleBody.textContent = '閉じる';
      } else {
        bodyContent.classList.remove('expanded');
        bodyContent.classList.add('collapsed');
        btnToggleBody.textContent = '展開する';
      }
    }

    btnToggleBody.addEventListener('click', function() {
      setBodyExpanded(bodyContent.classList.contains('collapsed'));
    });

    // ============================================================
    // Toggle: code snippet (cookie)
    // ============================================================
    function getCodeVisible() {
      var val = getCookie('codeSnippetVisible');
      return val === null ? false : val === 'true';
    }

    function setCodeVisible(visible) {
      setCookie('codeSnippetVisible', visible ? 'true' : 'false');
      if (visible) {
        codePanelsWrapper.classList.remove('collapsed');
        codePanelsWrapper.classList.add('expanded');
        btnToggleCode.textContent = '閉じる';
        btnToggleCode.classList.add('btn-toggle-active');
      } else {
        codePanelsWrapper.classList.remove('expanded');
        codePanelsWrapper.classList.add('collapsed');
        btnToggleCode.textContent = '展開する';
        btnToggleCode.classList.remove('btn-toggle-active');
      }
    }

    btnToggleCode.addEventListener('click', function() {
      setCodeVisible(codePanelsWrapper.classList.contains('collapsed'));
    });

    // ============================================================
    // Toggle: KV panel (cookie)
    // ============================================================
    function getKvVisible() {
      var val = getCookie('kvPanelVisible');
      return val === null ? false : val === 'true';
    }

    function setKvVisible(visible) {
      setCookie('kvPanelVisible', visible ? 'true' : 'false');
      if (visible) {
        kvPanelWrapper.classList.remove('collapsed');
        kvPanelWrapper.classList.add('expanded');
        btnToggleKv.textContent = '閉じる';
        btnToggleKv.classList.add('btn-toggle-active');
      } else {
        kvPanelWrapper.classList.remove('expanded');
        kvPanelWrapper.classList.add('collapsed');
        btnToggleKv.textContent = '展開する';
        btnToggleKv.classList.remove('btn-toggle-active');
      }
    }

    btnToggleKv.addEventListener('click', function() {
      setKvVisible(kvPanelWrapper.classList.contains('collapsed'));
    });

    // ============================================================
    // KV flatten + render (like json-parser.html)
    // ============================================================
    function kvGetType(v) {
      if (v === null) return 'null';
      if (Array.isArray(v)) return 'array';
      return typeof v;
    }

    function kvTypeBadge(t) {
      return '<span class="kv-type-badge kv-t-' + t + '">' + t + '</span>';
    }

    function kvEscHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function kvFlatten(obj) {
      var rows = [];
      function walk(node, path) {
        var t = kvGetType(node);
        if (t === 'object') {
          Object.keys(node).forEach(function(k) { walk(node[k], path ? path + '.' + k : k); });
        } else if (t === 'array') {
          node.forEach(function(item, i) { walk(item, path + '[' + i + ']'); });
        } else {
          rows.push({ key: path, value: node, type: t });
        }
        if (t === 'object' || t === 'array') {
          rows.push({ key: path || '(root)', value: JSON.stringify(node), type: t });
        }
      }
      walk(obj, '');
      return rows;
    }

    function renderKvTable(data) {
      if (!data) {
        kvEmpty.style.display = 'block';
        kvTableArea.innerHTML = '';
        return;
      }
      kvEmpty.style.display = 'none';
      var rows = kvFlatten(data);
      var html = '<p class="kv-count">' + rows.length + ' 件のキー/値ペア</p>';
      html += '<table class="kv-table"><thead><tr><th>キー (パス)</th><th>型</th><th>値</th></tr></thead><tbody>';
      rows.forEach(function(r) {
        var valDisplay = kvEscHtml(r.type === 'object' || r.type === 'array' ? r.value : String(r.value));
        html += '<tr><td class="kv-key-cell">' + kvEscHtml(r.key) + '</td><td>' + kvTypeBadge(r.type) + '</td><td class="kv-val-cell">' + valDisplay + '</td></tr>';
      });
      html += '</tbody></table>';
      kvTableArea.innerHTML = html;
    }

    // ============================================================
    // Edit body mode
    // ============================================================
    function setEditMode(editing) {
      isEditing = editing;
      if (editing) {
        requestBody.removeAttribute('readonly');
        requestBody.classList.remove('readonly-mode');
        btnEditBody.textContent = '確定';
        btnEditBody.classList.add('btn-edit-active');
        requestBody.focus();
      } else {
        requestBody.setAttribute('readonly', '');
        requestBody.classList.add('readonly-mode');
        btnEditBody.textContent = '変更する';
        btnEditBody.classList.remove('btn-edit-active');
        hideValidationErrors();
      }
    }

    btnEditBody.addEventListener('click', function() {
      if (isEditing) {
        try {
          JSON.parse(requestBody.value);
          setEditMode(false);
        } catch (e) {
          showValidationErrors(['JSON構文エラー: ' + e.message]);
        }
      } else {
        setEditMode(true);
      }
    });

    btnResetBody.addEventListener('click', function() {
      var ep = endpoints.find(function(e) { return e.id === endpointSelect.value; });
      if (ep && ep.defaultBody) {
        requestBody.value = ep.defaultBody;
        hideValidationErrors();
      }
    });

    // ============================================================
    // Validation
    // ============================================================
    function showValidationErrors(errors) {
      validationErrorsList.innerHTML = '';
      errors.forEach(function(err) {
        var li = document.createElement('li');
        li.textContent = err;
        validationErrorsList.appendChild(li);
      });
      validationErrors.classList.add('visible');
    }

    function hideValidationErrors() {
      validationErrors.classList.remove('visible');
      validationErrorsList.innerHTML = '';
    }

    function isValidEmail(str) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(str);
    }

    function validateRequestBody(ep, body) {
      var errors = [];
      if (!ep.validation) return errors;
      for (var field in ep.validation) {
        var rules = ep.validation[field];
        var value = body[field];
        if (rules.required && (value === undefined || value === null || value === '')) {
          errors.push(rules.label + ' は必須項目です');
          continue;
        }
        if (value === undefined || value === null) continue;
        if (rules.type === 'string') {
          if (typeof value !== 'string') { errors.push(rules.label + ' は文字列である必要があります'); }
          else {
            if (rules.minLength && value.length < rules.minLength) errors.push(rules.label + ' は' + rules.minLength + '文字以上で入力してください');
            if (rules.maxLength && value.length > rules.maxLength) errors.push(rules.label + ' は' + rules.maxLength + '文字以下で入力してください');
          }
        }
        if (rules.type === 'email' && (typeof value !== 'string' || !isValidEmail(value))) {
          errors.push(rules.label + ' は有効なメールアドレス形式で入力してください');
        }
        if (rules.type === 'boolean' && typeof value !== 'boolean') {
          errors.push(rules.label + ' は true または false で入力してください');
        }
        if (rules.type === 'array') {
          if (!Array.isArray(value)) errors.push(rules.label + ' は配列である必要があります');
          else if (rules.minLength && value.length < rules.minLength) errors.push(rules.label + ' は' + rules.minLength + '件以上必要です');
        }
      }
      return errors;
    }

    // ============================================================
    // Update display
    // ============================================================
    function updateDisplay() {
      var ep = endpoints.find(function(e) { return e.id === endpointSelect.value; });
      if (!ep) return;

      serverCode.innerHTML = ep.serverCode;
      clientCode.innerHTML = ep.clientCode;
      endpointInfo.innerHTML = methodBadge(ep.method) + ' <span class="endpoint-path">' + ep.path + '</span><div class="endpoint-desc">' + ep.desc + '</div>';

      if (ep.hasBody) {
        bodyInputArea.classList.add('visible');
        requestBody.value = ep.defaultBody || '{}';
        setEditMode(false);
        setBodyExpanded(getBodyExpanded());
      } else {
        bodyInputArea.classList.remove('visible');
      }
      hideValidationErrors();
    }

    // ============================================================
    // Tab switching
    // ============================================================
    document.querySelectorAll('.tab-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
        document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      });
    });

    // ============================================================
    // Send request
    // ============================================================
    function appendToOutput(html, className) {
      [outputFormatted, outputRaw].forEach(function(output, idx) {
        var div = document.createElement('div');
        div.className = 'response-item ' + className;
        div.innerHTML = (idx === 1 && className === 'json-line') ? html.replace(/<[^>]+>/g, '') : html;
        output.appendChild(div);
        output.scrollTop = output.scrollHeight;
      });
    }

    function sendRequest() {
      var ep = endpoints.find(function(e) { return e.id === endpointSelect.value; });
      if (!ep) return;
      var startMs = performance.now();
      var body = null;

      if (ep.hasBody) {
        try { body = JSON.parse(requestBody.value); }
        catch (e) {
          showValidationErrors(['JSON パースエラー: ' + e.message]);
          appendToOutput('JSON パースエラー: ' + e.message, 'error-line');
          return;
        }
        var errors = validateRequestBody(ep, body);
        if (errors.length > 0) {
          showValidationErrors(errors);
          appendToOutput('バリデーションエラー: ' + errors.join(', '), 'error-line');
          return;
        }
        hideValidationErrors();
      }

      if (isEditing) setEditMode(false);

      appendToOutput(methodBadge(ep.method) + ' ' + ep.path, 'request-line');
      if (body) {
        appendToOutput('<span style="color:#64748b">Request Body:</span>\n' + highlightJSON(body), 'json-line');
      }

      var delay = Math.floor(Math.random() * 150) + 50;
      setTimeout(function() {
        var result = ep.simulate(body);
        var elapsed = Math.floor(performance.now() - startMs);
        var statusCls = result.status < 400 ? 's2xx' : 's4xx';
        appendToOutput('<span class="' + statusCls + '">HTTP ' + result.status + '</span>  ' + elapsed + 'ms', 'status-line');

        if (result.body !== null) {
          appendToOutput(highlightJSON(result.body), 'json-line');
          lastResponseBody = result.body;
          renderKvTable(lastResponseBody);
        } else {
          appendToOutput('<span style="color:#64748b">(No Content)</span>', 'status-line');
          lastResponseBody = null;
          renderKvTable(null);
        }

        [outputFormatted, outputRaw].forEach(function(output) {
          var hr = document.createElement('div');
          hr.style.cssText = 'border-bottom:1px solid #2a2d3e;margin:0.6rem 0;';
          output.appendChild(hr);
          output.scrollTop = output.scrollHeight;
        });

        requestCount++;
        statCount.textContent = requestCount;
        statTime.textContent = elapsed + 'ms';
        statusText.textContent = ep.method + ' ' + ep.path + ' → ' + result.status;
      }, delay);
    }

    btnSend.addEventListener('click', sendRequest);

    btnClear.addEventListener('click', function() {
      outputFormatted.innerHTML = '';
      outputRaw.innerHTML = '';
      requestCount = 0;
      statCount.textContent = '0';
      statTime.textContent = '-';
      statusText.textContent = '待機中';
      lastResponseBody = null;
      renderKvTable(null);
    });

    // ============================================================
    // Initialize
    // ============================================================
    // Set initial cascade state
    populateActionSelect(categories[0].id);
    // Initial display
    updateDisplay();
    // Restore cookie states
    setBodyExpanded(getBodyExpanded());
    setCodeVisible(getCodeVisible());
    setKvVisible(getKvVisible());
  </script>
</body>
</html>
