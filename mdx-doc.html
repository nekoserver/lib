<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Code Block Example</title>

<style>
body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:#0d1117;
  color:#c9d1d9;
  margin:40px;
}

.codeblock{
  position:relative;
  margin:24px 0;
}

.copy{
  position:absolute;
  top:8px;
  right:8px;
  font-size:12px;
  padding:4px 10px;
  border:1px solid #30363d;
  background:#21262d;
  color:#c9d1d9;
  border-radius:4px;
  cursor:pointer;
}

.copy:hover{
  background:#30363d;
}

pre{
  margin:0;
  padding:16px;
  background:#161b22;
  border:1px solid #30363d;
  border-radius:8px;
  overflow:auto;
  counter-reset:line;
}

code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:14px;
  display:block;
}

.line{
  display:block;
  padding-left:3em;
  position:relative;
}

.line::before{
  counter-increment:line;
  content:counter(line);
  position:absolute;
  left:0;
  width:2.5em;
  text-align:right;
  color:#6e7681;
}
</style>

<script>
function copyCode(btn){
  const text = btn.parentElement.querySelector("code").innerText;
  navigator.clipboard.writeText(text);
  btn.textContent="Copied";
  setTimeout(()=>btn.textContent="Copy",1200);
}
</script>

</head>
<body>

<h1>Working Code Block</h1>

<div class="codeblock">
<button class="copy" onclick="copyCode(this)">Copy</button>

<pre><code>
<span class="line">npm create astro@latest docs</span>
<span class="line">cd docs</span>
<span class="line">npx astro add starlight</span>
<span class="line">npx astro add mdx</span>
</code></pre>

</div>

<div class="codeblock">
<button class="copy" onclick="copyCode(this)">Copy</button>

<pre><code>
<span class="line">import { defineConfig } from "astro/config"</span>
<span class="line">import starlight from "@astrojs/starlight"</span>
<span class="line"></span>
<span class="line">export default defineConfig({</span>
<span class="line">  integrations: [starlight()]</span>
<span class="line">})</span>
</code></pre>

</div>

</body>
</html>
