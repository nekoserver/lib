<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FastAPI 非ストリーミング サンプル</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 600;
      color: #f8fafc;
      margin-bottom: 0.5rem;
      letter-spacing: 0.02em;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 0.85rem;
      margin-bottom: 2rem;
    }

    /* --- Layout --- */
    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
      margin-bottom: 1.2rem;
    }

    @media (max-width: 700px) {
      .panels { grid-template-columns: 1fr; }
    }

    .panel {
      background: #1a1d2e;
      border: 1px solid #2a2d3e;
      border-radius: 10px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
    }

    .panel-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.8rem;
    }

    /* --- Code Block --- */
    .code-block {
      background: #111322;
      border: 1px solid #2a2d3e;
      border-radius: 8px;
      padding: 1rem;
      overflow-x: auto;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 0.75rem;
      line-height: 1.7;
      color: #c9d1d9;
      flex: 1;
      tab-size: 4;
      max-height: 420px;
      overflow-y: auto;
    }

    .code-block::-webkit-scrollbar { width: 6px; height: 6px; }
    .code-block::-webkit-scrollbar-track { background: transparent; }
    .code-block::-webkit-scrollbar-thumb { background: #3a3d5e; border-radius: 3px; }

    .code-block .kw { color: #c678dd; }
    .code-block .fn { color: #61afef; }
    .code-block .str { color: #98c379; }
    .code-block .dec { color: #e5c07b; }
    .code-block .cmt { color: #5c6370; font-style: italic; }
    .code-block .num { color: #d19a66; }
    .code-block .op { color: #56b6c2; }
    .code-block .cls { color: #e5c07b; }

    /* --- Controls --- */
    .controls {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 1.2rem;
    }

    .controls label {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .controls select {
      background: #1a1d2e;
      border: 1px solid #2a2d3e;
      border-radius: 6px;
      color: #e2e8f0;
      padding: 0.45rem 0.7rem;
      font-size: 0.82rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .controls select:focus {
      border-color: #6366f1;
    }

    .btn {
      padding: 0.5rem 1.2rem;
      border: none;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: #6366f1;
      color: #fff;
    }

    .btn-primary:hover { background: #5558e6; }

    .btn-clear {
      background: #374151;
      color: #d1d5db;
    }

    .btn-clear:hover { background: #4b5563; }

    /* --- Method Badge --- */
    .method-badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      margin-right: 0.3rem;
    }

    .method-get { background: #064e3b; color: #6ee7b7; }
    .method-post { background: #1e3a5f; color: #93c5fd; }
    .method-put { background: #713f12; color: #fcd34d; }
    .method-delete { background: #7f1d1d; color: #fca5a5; }
    .method-patch { background: #4a1d6a; color: #d8b4fe; }

    /* --- Output Area --- */
    .output-area {
      background: #111322;
      border: 1px solid #2a2d3e;
      border-radius: 10px;
      padding: 1rem;
      min-height: 160px;
      max-height: 480px;
      overflow-y: auto;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 0.8rem;
      line-height: 1.6;
    }

    .output-area::-webkit-scrollbar { width: 6px; }
    .output-area::-webkit-scrollbar-track { background: transparent; }
    .output-area::-webkit-scrollbar-thumb { background: #3a3d5e; border-radius: 3px; }

    .response-item {
      padding: 0.5rem 0.8rem;
      border-radius: 6px;
      margin-bottom: 0.5rem;
      animation: fadeIn 0.3s ease;
      word-break: break-all;
    }

    .response-item.request-line {
      background: #1a2332;
      border-left: 3px solid #6366f1;
      color: #a5b4fc;
      font-weight: 600;
    }

    .response-item.status-line {
      font-size: 0.75rem;
      color: #94a3b8;
      padding: 0.2rem 0.8rem;
    }

    .response-item.status-line .s2xx { color: #86efac; font-weight: 600; }
    .response-item.status-line .s4xx { color: #fca5a5; font-weight: 600; }

    .response-item.json-line {
      background: #151927;
      border-left: 3px solid #22c55e;
    }

    .response-item.error-line {
      background: #2d1b1b;
      border-left: 3px solid #ef4444;
      color: #fca5a5;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .json-key { color: #7dd3fc; }
    .json-str { color: #98c379; }
    .json-num { color: #d19a66; }
    .json-bool { color: #c678dd; }
    .json-null { color: #5c6370; }
    .json-brace { color: #abb2bf; }

    /* --- Status Bar --- */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-top: 0.8rem;
      font-size: 0.78rem;
      color: #64748b;
    }

    .stats {
      margin-left: auto;
      display: flex;
      gap: 1rem;
    }

    .stats span { color: #94a3b8; }
    .stats strong { color: #e2e8f0; }

    /* --- Tabs --- */
    .tab-bar {
      display: flex;
      gap: 0.3rem;
      margin-bottom: 1rem;
    }

    .tab-btn {
      padding: 0.4rem 1rem;
      border: 1px solid #2a2d3e;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      background: #1a1d2e;
      color: #94a3b8;
      font-size: 0.78rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .tab-btn.active {
      background: #111322;
      color: #e2e8f0;
      border-color: #6366f1;
      border-bottom: 1px solid #111322;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* --- Request Body Input --- */
    .body-input-area {
      margin-bottom: 1.2rem;
      display: none;
    }

    .body-input-area.visible { display: block; }

    .body-input-area textarea {
      width: 100%;
      background: #1a1d2e;
      border: 1px solid #2a2d3e;
      border-radius: 8px;
      color: #e2e8f0;
      padding: 0.8rem;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 0.8rem;
      line-height: 1.6;
      resize: vertical;
      min-height: 80px;
      outline: none;
      transition: border-color 0.2s;
    }

    .body-input-area textarea:focus {
      border-color: #6366f1;
    }

    .body-input-area textarea.readonly-mode {
      opacity: 0.7;
      cursor: default;
    }

    /* --- Body Header --- */
    .body-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
      flex-wrap: wrap;
    }

    .body-header .body-label {
      font-size: 0.78rem;
      color: #94a3b8;
    }

    .btn-sm {
      padding: 0.2rem 0.6rem;
      border: 1px solid #2a2d3e;
      border-radius: 4px;
      background: #1a1d2e;
      color: #94a3b8;
      font-size: 0.72rem;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 600;
    }

    .btn-sm:hover {
      background: #2a2d3e;
      color: #e2e8f0;
    }

    .btn-sm.btn-toggle-active {
      background: #6366f1;
      color: #fff;
      border-color: #6366f1;
    }

    .btn-sm.btn-edit-active {
      background: #059669;
      color: #fff;
      border-color: #059669;
    }

    .body-content {
      transition: max-height 0.3s ease, opacity 0.3s ease;
      overflow: hidden;
    }

    .body-content.collapsed {
      max-height: 0;
      opacity: 0;
      margin: 0;
    }

    .body-content.expanded {
      max-height: 500px;
      opacity: 1;
    }

    /* --- Validation Error --- */
    .validation-errors {
      background: #2d1b1b;
      border: 1px solid #ef4444;
      border-radius: 6px;
      padding: 0.6rem 0.8rem;
      margin-top: 0.4rem;
      font-size: 0.75rem;
      color: #fca5a5;
      display: none;
    }

    .validation-errors.visible {
      display: block;
    }

    .validation-errors ul {
      list-style: none;
      padding: 0;
    }

    .validation-errors li::before {
      content: "! ";
      font-weight: 700;
      color: #ef4444;
    }

    /* --- Endpoint Info --- */
    .endpoint-info {
      background: #1a1d2e;
      border: 1px solid #2a2d3e;
      border-radius: 8px;
      padding: 0.6rem 1rem;
      margin-bottom: 1.2rem;
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .endpoint-info .endpoint-path {
      color: #e2e8f0;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-weight: 600;
    }

    .endpoint-info .endpoint-desc {
      margin-top: 0.3rem;
      font-size: 0.75rem;
    }

    /* --- Code Snippet Section --- */
    .code-snippet-section {
      margin-bottom: 1.2rem;
    }

    .code-snippet-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.8rem;
    }

    .code-snippet-toggle .toggle-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .code-panels-wrapper {
      transition: max-height 0.4s ease, opacity 0.3s ease;
      overflow: hidden;
    }

    .code-panels-wrapper.collapsed {
      max-height: 0;
      opacity: 0;
    }

    .code-panels-wrapper.expanded {
      max-height: 2000px;
      opacity: 1;
    }

    /* --- Edit Controls --- */
    .edit-controls {
      display: flex;
      gap: 0.4rem;
      margin-left: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>FastAPI 非ストリーミング サンプル</h1>
    <p class="subtitle">通常のJSON レスポンスを返すREST API デモ（フロントエンドシミュレーション）</p>

    <!-- Controls -->
    <div class="controls">
      <label>エンドポイント:</label>
      <select id="endpoint-select"></select>
      <button class="btn btn-primary" id="btn-send">送信</button>
      <button class="btn btn-clear" id="btn-clear">クリア</button>
    </div>

    <!-- Endpoint Info -->
    <div class="endpoint-info" id="endpoint-info"></div>

    <!-- Code Snippet Section (collapsible) -->
    <div class="code-snippet-section">
      <div class="code-snippet-toggle">
        <span class="toggle-label">コードスニペット</span>
        <button class="btn-sm" id="btn-toggle-code">展開する</button>
      </div>
      <div class="code-panels-wrapper collapsed" id="code-panels-wrapper">
        <div class="panels">
          <div class="panel">
            <div class="panel-title">Server（FastAPI）</div>
            <div class="code-block" id="server-code"></div>
          </div>
          <div class="panel">
            <div class="panel-title">Client（JavaScript）</div>
            <div class="code-block" id="client-code"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Request Body -->
    <div class="body-input-area" id="body-input-area">
      <div class="body-header">
        <span class="body-label">Request Body (JSON):</span>
        <button class="btn-sm" id="btn-toggle-body">閉じる</button>
        <div class="edit-controls">
          <button class="btn-sm" id="btn-edit-body">変更する</button>
          <button class="btn-sm" id="btn-reset-body">リセット</button>
        </div>
      </div>
      <div class="body-content expanded" id="body-content">
        <textarea id="request-body" spellcheck="false" readonly></textarea>
      </div>
      <div class="validation-errors" id="validation-errors">
        <ul id="validation-errors-list"></ul>
      </div>
    </div>

    <!-- Output Tabs -->
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="formatted">Formatted</button>
      <button class="tab-btn" data-tab="raw">Raw</button>
    </div>

    <div id="tab-formatted" class="tab-content active">
      <div class="output-area" id="output-formatted"></div>
    </div>
    <div id="tab-raw" class="tab-content">
      <div class="output-area" id="output-raw"></div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
      <span id="status-text">待機中</span>
      <div class="stats">
        <span>リクエスト数: <strong id="stat-count">0</strong></span>
        <span>最終レスポンス: <strong id="stat-time">-</strong></span>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // Cookie helpers
    // ============================================================
    function setCookie(name, value, days) {
      const d = new Date();
      d.setTime(d.getTime() + (days || 365) * 24 * 60 * 60 * 1000);
      document.cookie = `${name}=${encodeURIComponent(value)};expires=${d.toUTCString()};path=/;SameSite=Lax`;
    }

    function getCookie(name) {
      const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
      return match ? decodeURIComponent(match[2]) : null;
    }

    // ============================================================
    // Endpoint definitions
    // ============================================================
    const endpoints = [
      {
        id: 'list_users',
        method: 'GET',
        path: '/users',
        desc: 'ユーザー一覧を取得（クエリパラメータでページネーション）',
        hasBody: false,
        serverCode: `<span class="kw">from</span> fastapi <span class="kw">import</span> FastAPI, Query
<span class="kw">from</span> pydantic <span class="kw">import</span> BaseModel

app = <span class="fn">FastAPI</span>()

<span class="kw">class</span> <span class="cls">User</span>(<span class="cls">BaseModel</span>):
    id: <span class="dec">int</span>
    name: <span class="dec">str</span>
    email: <span class="dec">str</span>
    is_active: <span class="dec">bool</span> = <span class="num">True</span>

<span class="cmt"># 仮のデータベース</span>
fake_db: <span class="dec">list</span>[<span class="cls">User</span>] = [...]

<span class="dec">@app.get</span>(<span class="str">"/users"</span>)
<span class="kw">def</span> <span class="fn">list_users</span>(
    skip: <span class="dec">int</span> = <span class="fn">Query</span>(<span class="num">0</span>, ge=<span class="num">0</span>),
    limit: <span class="dec">int</span> = <span class="fn">Query</span>(<span class="num">10</span>, ge=<span class="num">1</span>, le=<span class="num">100</span>)
):
    users = fake_db[skip : skip + limit]
    <span class="kw">return</span> {
        <span class="str">"total"</span>: <span class="fn">len</span>(fake_db),
        <span class="str">"skip"</span>: skip,
        <span class="str">"limit"</span>: limit,
        <span class="str">"data"</span>: users
    }`,
        clientCode: `<span class="kw">const</span> response = <span class="kw">await</span> <span class="fn">fetch</span>(<span class="str">"/users?skip=0&limit=10"</span>);
<span class="kw">const</span> data = <span class="kw">await</span> response.<span class="fn">json</span>();

console.<span class="fn">log</span>(data.total);  <span class="cmt">// 総件数</span>
console.<span class="fn">log</span>(data.data);   <span class="cmt">// ユーザー配列</span>`,
        simulate() {
          const users = [];
          const names = ['田中太郎', '鈴木花子', '佐藤一郎', '高橋美咲', '伊藤健太'];
          for (let i = 0; i < names.length; i++) {
            users.push({
              id: i + 1,
              name: names[i],
              email: `${['tanaka', 'suzuki', 'sato', 'takahashi', 'ito'][i]}@example.com`,
              is_active: Math.random() > 0.2
            });
          }
          return { status: 200, body: { total: users.length, skip: 0, limit: 10, data: users } };
        }
      },
      {
        id: 'get_user',
        method: 'GET',
        path: '/users/{user_id}',
        desc: 'パスパラメータで指定したユーザーを取得',
        hasBody: false,
        serverCode: `<span class="kw">from</span> fastapi <span class="kw">import</span> FastAPI, HTTPException

app = <span class="fn">FastAPI</span>()

<span class="dec">@app.get</span>(<span class="str">"/users/{user_id}"</span>)
<span class="kw">def</span> <span class="fn">get_user</span>(user_id: <span class="dec">int</span>):
    user = <span class="fn">find_user</span>(user_id)  <span class="cmt"># DB検索</span>
    <span class="kw">if</span> user <span class="kw">is</span> <span class="num">None</span>:
        <span class="kw">raise</span> <span class="fn">HTTPException</span>(
            status_code=<span class="num">404</span>,
            detail=<span class="str">f"User {user_id} not found"</span>
        )
    <span class="kw">return</span> user`,
        clientCode: `<span class="kw">const</span> userId = <span class="num">1</span>;
<span class="kw">const</span> response = <span class="kw">await</span> <span class="fn">fetch</span>(<span class="str">\`/users/\${userId}\`</span>);

<span class="kw">if</span> (!response.ok) {
  <span class="kw">const</span> err = <span class="kw">await</span> response.<span class="fn">json</span>();
  console.<span class="fn">error</span>(err.detail);  <span class="cmt">// "User 999 not found"</span>
  <span class="kw">return</span>;
}

<span class="kw">const</span> user = <span class="kw">await</span> response.<span class="fn">json</span>();
console.<span class="fn">log</span>(user.name);`,
        simulate() {
          const found = Math.random() > 0.3;
          if (!found) {
            return { status: 404, body: { detail: "User 999 not found" } };
          }
          return {
            status: 200,
            body: {
              id: 1,
              name: '田中太郎',
              email: 'tanaka@example.com',
              is_active: true,
              created_at: new Date().toISOString()
            }
          };
        }
      },
      {
        id: 'create_user',
        method: 'POST',
        path: '/users',
        desc: 'Pydanticモデルでバリデーションしてユーザーを作成',
        hasBody: true,
        defaultBody: JSON.stringify({ name: "山田花子", email: "yamada@example.com", is_active: true }, null, 2),
        validation: {
          name: { required: true, type: 'string', minLength: 1, maxLength: 50, label: 'name' },
          email: { required: true, type: 'email', label: 'email' },
          is_active: { required: false, type: 'boolean', label: 'is_active' }
        },
        serverCode: `<span class="kw">from</span> fastapi <span class="kw">import</span> FastAPI
<span class="kw">from</span> pydantic <span class="kw">import</span> BaseModel, EmailStr, Field

app = <span class="fn">FastAPI</span>()

<span class="kw">class</span> <span class="cls">UserCreate</span>(<span class="cls">BaseModel</span>):
    name: <span class="dec">str</span> = <span class="fn">Field</span>(..., min_length=<span class="num">1</span>, max_length=<span class="num">50</span>)
    email: <span class="cls">EmailStr</span>
    is_active: <span class="dec">bool</span> = <span class="num">True</span>

<span class="kw">class</span> <span class="cls">UserResponse</span>(<span class="cls">BaseModel</span>):
    id: <span class="dec">int</span>
    name: <span class="dec">str</span>
    email: <span class="dec">str</span>
    is_active: <span class="dec">bool</span>
    created_at: <span class="dec">str</span>

<span class="dec">@app.post</span>(<span class="str">"/users"</span>, response_model=<span class="cls">UserResponse</span>, status_code=<span class="num">201</span>)
<span class="kw">def</span> <span class="fn">create_user</span>(user: <span class="cls">UserCreate</span>):
    new_user = <span class="fn">save_to_db</span>(user)
    <span class="kw">return</span> new_user`,
        clientCode: `<span class="kw">const</span> newUser = {
  name: <span class="str">"山田花子"</span>,
  email: <span class="str">"yamada@example.com"</span>,
  is_active: <span class="num">true</span>
};

<span class="kw">const</span> response = <span class="kw">await</span> <span class="fn">fetch</span>(<span class="str">"/users"</span>, {
  method: <span class="str">"POST"</span>,
  headers: { <span class="str">"Content-Type"</span>: <span class="str">"application/json"</span> },
  body: JSON.<span class="fn">stringify</span>(newUser)

  method: <span class="str">"POST"</span>,
  headers: { <span class="str">"Content-Type"</span>: <span class="str">"application/json"</span> },
  body: JSON.<span class="fn">stringify</span>(order)
});

<span class="kw">if</span> (response.status === <span class="num">201</span>) {
  <span class="kw">const</span> result = <span class="kw">await</span> response.<span class="fn">json</span>();
  console.<span class="fn">log</span>(<span class="str">\`注文ID: \${result.order_id}\`</span>);
  console.<span class="fn">log</span>(<span class="str">\`合計: \\&yen;\${result.total_price}\`</span>);
}`,
        simulate(body) {
          if (!body || !body.items || !body.items.length) {
            return {
              status: 422,
              body: { detail: [{ loc: ["body", "items"], msg: "field required", type: "value_error.missing" }] }
            };
          }
          const prices = { 1: 1500, 2: 2800, 3: 980, 4: 4200, 5: 650 };
          let total = 0;
          body.items.forEach(item => {
            total += (prices[item.product_id] || 1000) * item.quantity;
          });
          return {
            status: 201,
            body: {
              order_id: `ORD-${Date.now().toString(36).toUpperCase()}`,
              status: "pending",
              items: body.items,
              total_price: total,
              shipping_address: body.shipping_address || "未指定",
              created_at: new Date().toISOString()
            }
          };
        }
      },
      {
        id: 'health_check',
        method: 'GET',
        path: '/health',
        desc: 'ヘルスチェック用エンドポイント（サービス稼働状態を確認）',
        hasBody: false,
        serverCode: `<span class="kw">from</span> fastapi <span class="kw">import</span> FastAPI
<span class="kw">from</span> datetime <span class="kw">import</span> datetime

app = <span class="fn">FastAPI</span>()

<span class="dec">@app.get</span>(<span class="str">"/health"</span>)
<span class="kw">def</span> <span class="fn">health_check</span>():
    <span class="kw">return</span> {
        <span class="str">"status"</span>: <span class="str">"healthy"</span>,
        <span class="str">"timestamp"</span>: datetime.<span class="fn">utcnow</span>().<span class="fn">isoformat</span>(),
        <span class="str">"version"</span>: <span class="str">"1.0.0"</span>,
        <span class="str">"services"</span>: {
            <span class="str">"database"</span>: <span class="str">"connected"</span>,
            <span class="str">"cache"</span>: <span class="str">"connected"</span>
        }
    }`,
        clientCode: `<span class="kw">const</span> response = <span class="kw">await</span> <span class="fn">fetch</span>(<span class="str">"/health"</span>);
<span class="kw">const</span> health = <span class="kw">await</span> response.<span class="fn">json</span>();

<span class="kw">if</span> (health.status === <span class="str">"healthy"</span>) {
  console.<span class="fn">log</span>(<span class="str">"サービス正常稼働中"</span>);
  console.<span class="fn">log</span>(<span class="str">\`バージョン: \${health.version}\`</span>);
} <span class="kw">else</span> {
  console.<span class="fn">error</span>(<span class="str">"サービス異常検出"</span>);
}`,
        simulate() {
          return {
            status: 200,
            body: {
              status: "healthy",
              timestamp: new Date().toISOString(),
              version: "1.0.0",
              services: {
                database: "connected",
                cache: "connected"
              }
            }
          };
        }
      }
    ];

    // ============================================================
    // DOM
    // ============================================================
    const endpointSelect = document.getElementById('endpoint-select');
    const btnSend = document.getElementById('btn-send');
    const btnClear = document.getElementById('btn-clear');
    const outputFormatted = document.getElementById('output-formatted');
    const outputRaw = document.getElementById('output-raw');
    const statusText = document.getElementById('status-text');
    const statCount = document.getElementById('stat-count');
    const statTime = document.getElementById('stat-time');
    const serverCode = document.getElementById('server-code');
    const clientCode = document.getElementById('client-code');
    const endpointInfo = document.getElementById('endpoint-info');
    const bodyInputArea = document.getElementById('body-input-area');
    const requestBody = document.getElementById('request-body');
    const bodyContent = document.getElementById('body-content');
    const btnToggleBody = document.getElementById('btn-toggle-body');
    const btnEditBody = document.getElementById('btn-edit-body');
    const btnResetBody = document.getElementById('btn-reset-body');
    const btnToggleCode = document.getElementById('btn-toggle-code');
    const codePanelsWrapper = document.getElementById('code-panels-wrapper');
    const validationErrors = document.getElementById('validation-errors');
    const validationErrorsList = document.getElementById('validation-errors-list');

    let requestCount = 0;
    let isEditing = false;

    // ============================================================
    // Populate endpoint select
    // ============================================================
    endpoints.forEach(ep => {
      const opt = document.createElement('option');
      opt.value = ep.id;
      opt.textContent = `${ep.method} ${ep.path}`;
      endpointSelect.appendChild(opt);
    });

    // ============================================================
    // Highlight JSON
    // ============================================================
    function highlightJSON(obj, indent = 0) {
      const pad = '  '.repeat(indent);
      const padInner = '  '.repeat(indent + 1);

      if (obj === null) return `<span class="json-null">null</span>`;
      if (typeof obj === 'boolean') return `<span class="json-bool">${obj}</span>`;
      if (typeof obj === 'number') return `<span class="json-num">${obj}</span>`;
      if (typeof obj === 'string') {
        const escaped = obj.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return `<span class="json-str">"${escaped}"</span>`;
      }
      if (Array.isArray(obj)) {
        if (obj.length === 0) return `<span class="json-brace">[]</span>`;
        const items = obj.map(v => padInner + highlightJSON(v, indent + 1));
        return `<span class="json-brace">[</span>\n${items.join(',\n')}\n${pad}<span class="json-brace">]</span>`;
      }
      const keys = Object.keys(obj);
      if (keys.length === 0) return `<span class="json-brace">{}</span>`;
      const entries = keys.map(k => {
        const keyStr = `<span class="json-key">"${k}"</span>`;
        return `${padInner}${keyStr}: ${highlightJSON(obj[k], indent + 1)}`;
      });
      return `<span class="json-brace">{</span>\n${entries.join(',\n')}\n${pad}<span class="json-brace">}</span>`;
    }

    // ============================================================
    // Method badge helper
    // ============================================================
    function methodBadge(method) {
      const cls = `method-${method.toLowerCase()}`;
      return `<span class="method-badge ${cls}">${method}</span>`;
    }

    // ============================================================
    // Toggle body visibility (with cookie)
    // ============================================================
    function getBodyExpanded() {
      const val = getCookie('bodyExpanded');
      return val === null ? true : val === 'true';
    }

    function setBodyExpanded(expanded) {
      setCookie('bodyExpanded', expanded ? 'true' : 'false');
      if (expanded) {
        bodyContent.classList.remove('collapsed');
        bodyContent.classList.add('expanded');
        btnToggleBody.textContent = '閉じる';
      } else {
        bodyContent.classList.remove('expanded');
        bodyContent.classList.add('collapsed');
        btnToggleBody.textContent = '展開する';
      }
    }

    btnToggleBody.addEventListener('click', () => {
      const isExpanded = bodyContent.classList.contains('expanded');
      setBodyExpanded(!isExpanded);
    });

    // ============================================================
    // Toggle code snippet visibility (with cookie)
    // ============================================================
    function getCodeVisible() {
      const val = getCookie('codeSnippetVisible');
      return val === null ? false : val === 'true';
    }

    function setCodeVisible(visible) {
      setCookie('codeSnippetVisible', visible ? 'true' : 'false');
      if (visible) {
        codePanelsWrapper.classList.remove('collapsed');
        codePanelsWrapper.classList.add('expanded');
        btnToggleCode.textContent = '閉じる';
        btnToggleCode.classList.add('btn-toggle-active');
      } else {
        codePanelsWrapper.classList.remove('expanded');
        codePanelsWrapper.classList.add('collapsed');
        btnToggleCode.textContent = '展開する';
        btnToggleCode.classList.remove('btn-toggle-active');
      }
    }

    btnToggleCode.addEventListener('click', () => {
      const isVisible = codePanelsWrapper.classList.contains('expanded');
      setCodeVisible(!isVisible);
    });

    // ============================================================
    // Edit body mode
    // ============================================================
    function setEditMode(editing) {
      isEditing = editing;
      if (editing) {
        requestBody.removeAttribute('readonly');
        requestBody.classList.remove('readonly-mode');
        btnEditBody.textContent = '確定';
        btnEditBody.classList.add('btn-edit-active');
        requestBody.focus();
      } else {
        requestBody.setAttribute('readonly', '');
        requestBody.classList.add('readonly-mode');
        btnEditBody.textContent = '変更する';
        btnEditBody.classList.remove('btn-edit-active');
        hideValidationErrors();
      }
    }

    btnEditBody.addEventListener('click', () => {
      if (isEditing) {
        // Validate JSON before confirming
        try {
          JSON.parse(requestBody.value);
          setEditMode(false);
        } catch (e) {
          showValidationErrors([`JSON構文エラー: ${e.message}`]);
        }
      } else {
        setEditMode(true);
      }
    });

    btnResetBody.addEventListener('click', () => {
      const ep = endpoints.find(e => e.id === endpointSelect.value);
      if (ep && ep.defaultBody) {
        requestBody.value = ep.defaultBody;
        hideValidationErrors();
      }
    });

    // ============================================================
    // Validation
    // ============================================================
    function showValidationErrors(errors) {
      validationErrorsList.innerHTML = '';
      errors.forEach(err => {
        const li = document.createElement('li');
        li.textContent = err;
        validationErrorsList.appendChild(li);
      });
      validationErrors.classList.add('visible');
    }

    function hideValidationErrors() {
      validationErrors.classList.remove('visible');
      validationErrorsList.innerHTML = '';
    }

    function isValidEmail(str) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(str);
    }

    function validateRequestBody(ep, body) {
      const errors = [];
      if (!ep.validation) return errors;

      for (const [field, rules] of Object.entries(ep.validation)) {
        const value = body[field];

        if (rules.required && (value === undefined || value === null || value === '')) {
          errors.push(`${rules.label} は必須項目です`);
          continue;
        }

        if (value === undefined || value === null) continue;

        if (rules.type === 'string') {
          if (typeof value !== 'string') {
            errors.push(`${rules.label} は文字列である必要があります`);
          } else {
            if (rules.minLength && value.length < rules.minLength) {
              errors.push(`${rules.label} は${rules.minLength}文字以上で入力してください`);
            }
            if (rules.maxLength && value.length > rules.maxLength) {
              errors.push(`${rules.label} は${rules.maxLength}文字以下で入力してください`);
            }
          }
        }

        if (rules.type === 'email') {
          if (typeof value !== 'string' || !isValidEmail(value)) {
            errors.push(`${rules.label} は有効なメールアドレス形式で入力してください`);
          }
        }

        if (rules.type === 'boolean') {
          if (typeof value !== 'boolean') {
            errors.push(`${rules.label} は true または false で入力してください`);
          }
        }

        if (rules.type === 'array') {
          if (!Array.isArray(value)) {
            errors.push(`${rules.label} は配列である必要があります`);
          } else if (rules.minLength && value.length < rules.minLength) {
            errors.push(`${rules.label} は${rules.minLength}件以上必要です`);
          }
        }
      }

      return errors;
    }

    // ============================================================
    // Update display when endpoint changes
    // ============================================================
    function updateDisplay() {
      const ep = endpoints.find(e => e.id === endpointSelect.value);
      if (!ep) return;

      serverCode.innerHTML = ep.serverCode;
      clientCode.innerHTML = ep.clientCode;
      endpointInfo.innerHTML = `${methodBadge(ep.method)} <span class="endpoint-path">${ep.path}</span><div class="endpoint-desc">${ep.desc}</div>`;

      if (ep.hasBody) {
        bodyInputArea.classList.add('visible');
        requestBody.value = ep.defaultBody || '{}';
        setEditMode(false);
        setBodyExpanded(getBodyExpanded());
      } else {
        bodyInputArea.classList.remove('visible');
      }

      hideValidationErrors();
    }

    endpointSelect.addEventListener('change', updateDisplay);

    // ============================================================
    // Tab switching
    // ============================================================
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
      });
    });

    // ============================================================
    // Send simulated request
    // ============================================================
    function appendToOutput(html, className) {
      for (const [output, isRaw] of [[outputFormatted, false], [outputRaw, true]]) {
        const div = document.createElement('div');
        div.className = `response-item ${className}`;
        div.innerHTML = isRaw && className === 'json-line' ? html.replace(/<[^>]+>/g, '') : html;
        output.appendChild(div);
        output.scrollTop = output.scrollHeight;
      }
    }

    function sendRequest() {
      const ep = endpoints.find(e => e.id === endpointSelect.value);
      if (!ep) return;

      const startMs = performance.now();

      // Parse body if applicable
      let body = null;
      if (ep.hasBody) {
        try {
          body = JSON.parse(requestBody.value);
        } catch (e) {
          showValidationErrors([`JSON パースエラー: ${e.message}`]);
          appendToOutput(`JSON パースエラー: ${e.message}`, 'error-line');
          return;
        }

        // Run validation
        const errors = validateRequestBody(ep, body);
        if (errors.length > 0) {
          showValidationErrors(errors);
          appendToOutput(`バリデーションエラー: ${errors.join(', ')}`, 'error-line');
          return;
        }

        hideValidationErrors();
      }

      // If still in edit mode, confirm first
      if (isEditing) {
        setEditMode(false);
      }

      // Show request line
      appendToOutput(`${methodBadge(ep.method)} ${ep.path}`, 'request-line');

      // Show request body if applicable
      if (body) {
        appendToOutput(`<span style="color:#64748b">Request Body:</span>\n${highlightJSON(body)}`, 'json-line');
      }

      // Simulate delay (50-200ms)
      const delay = Math.floor(Math.random() * 150) + 50;

      setTimeout(() => {
        const result = ep.simulate(body);
        const elapsed = Math.floor(performance.now() - startMs);

        // Status line
        const statusCls = result.status < 400 ? 's2xx' : 's4xx';
        appendToOutput(`<span class="${statusCls}">HTTP ${result.status}</span>  ${elapsed}ms`, 'status-line');

        // Response body
        if (result.body !== null) {
          appendToOutput(highlightJSON(result.body), 'json-line');
        } else {
          appendToOutput('<span style="color:#64748b">(No Content)</span>', 'status-line');
        }

        // Separator
        for (const output of [outputFormatted, outputRaw]) {
          const hr = document.createElement('div');
          hr.style.cssText = 'border-bottom:1px solid #2a2d3e;margin:0.6rem 0;';
          output.appendChild(hr);
          output.scrollTop = output.scrollHeight;
        }

        // Update stats
        requestCount++;
        statCount.textContent = requestCount;
        statTime.textContent = `${elapsed}ms`;
        statusText.textContent = `${ep.method} ${ep.path} → ${result.status}`;
      }, delay);
    }

    btnSend.addEventListener('click', sendRequest);

    btnClear.addEventListener('click', () => {
      outputFormatted.innerHTML = '';
      outputRaw.innerHTML = '';
      requestCount = 0;
      statCount.textContent = '0';
      statTime.textContent = '-';
      statusText.textContent = '待機中';
    });

    // ============================================================
    // Initialize from cookies
    // ============================================================
    updateDisplay();
    setBodyExpanded(getBodyExpanded());
    setCodeVisible(getCodeVisible());
  </script>
</body>
</html>
