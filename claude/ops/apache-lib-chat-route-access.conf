# 経路情報によるアクセス制御（2026-11-13）。起動オプション LIB_ROUTE_ACCESS_CONTROL=1 のときだけ、
# restore-claude-host.sh が /etc/apache2/lib-chat-route-access.conf に置き、lib-chat.conf の末尾で読む。
# libを管理者専用にしたvhost（2026-11-11の判断）でも、経路IDが許可リストに合う要求（lib-chat.conf が
# LIB_CHAT_VIA_KNOWN=1 にする）だけ、チャットの経路を通す。経路情報の無い要求は拒否する。
# 後の<LocationMatch>が先の拒否より優先されるため、vhostの拒否の後でIncludeされる。
# 経路は独自にログイン・HMACのセッション・frame-ancestorsでも守られている。経路IDは秘密ではない。
<LocationMatch "^/lib/(?:conversation-embed[.]html$|chat/|t/[A-Za-z0-9_-]+/(?:conversation-embed[.]html$|chat/)|api/chat/)">
    Require env LIB_CHAT_VIA_KNOWN
</LocationMatch>
