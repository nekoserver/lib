<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Fixed Cyber Attack Globe</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #info { position: absolute; top: 20px; left: 20px; color: #00f2ff; z-index: 10; pointer-events: none; }
    </style>
</head>
<body>
    <div id="info">
        <h2 style="margin:0;">攻撃アクティビティ・ビジュアライザー</h2>
        <p>マウスで回転 / スクロールでズーム</p>
    </div>
    <div id="globeViz"></div>

    <script src="https://unpkg.com/three"></script>
    <script src="https://unpkg.com/three-globe"></script>
    <script src="https://unpkg.com/three/examples/js/controls/OrbitControls.js"></script>

    <script>
        // データの定義
        const arcsData = [
            { startLat: -14.2, startLng: -51.9, endLat: 35.8, endLng: 104.1, color: '#a0d2eb', stroke: 1.5 }, // BR -> CN
            { startLat: 37.1, startLng: -95.7, endLat: 39.5, endLng: -98.5, color: '#e5cfaf', stroke: 1.2 }, // US -> US
            { startLat: 48.8, startLng: 2.3, endLat: 37.1, endLng: -95.7, color: '#81b622', stroke: 0.5 },  // FR -> US
            { startLat: 51.1, startLng: 10.4, endLat: 37.1, endLng: -95.7, color: '#5fad41', stroke: 0.4 }, // DE -> US
            { startLat: 55.3, startLng: -3.4, endLat: 37.1, endLng: -95.7, color: '#af4b91', stroke: 0.4 },  // GB -> US
            { startLat: 35.9, startLng: 127.7, endLat: 35.8, endLng: 104.1, color: '#d1b200', stroke: 0.3 } // KR -> CN
        ];

        // 地球儀の作成
        const World = new ThreeGlobe()
            .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
            .arcsData(arcsData)
            .arcColor('color')
            .arcDashLength(0.4)
            .arcDashGap(2)
            .arcDashAnimateTime(1500)
            .arcStroke('stroke');

        // レンダラー設定
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('globeViz').appendChild(renderer.domElement);

        // シーン設定
        const scene = new THREE.Scene();
        scene.add(World);
        scene.add(new THREE.AmbientLight(0xcccccc, 0.7));
        scene.add(new THREE.DirectionalLight(0xffffff, 0.4));

        // カメラ設定
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.z = 400;

        // 【重要】ぐりぐり動かすためのControls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.8;
        controls.autoRotate = true; // 最初は勝手に回る
        controls.autoRotateSpeed = 0.5;

        // アニメーション
        function animate() {
            controls.update(); // マウス操作の反映
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        // リサイズ対応
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
