openapi: 3.0.3
info:
  title: Orders API Sample
  version: 1.0.0
  description: Order creation and retrieval sample with bearer auth.
servers:
  - url: https://api.example.com
tags:
  - name: orders
security:
  - bearerAuth: []
paths:
  /orders:
    post:
      tags: [orders]
      summary: Create order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: Unauthorized
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -X POST "https://api.example.com/orders" \
              -H "Authorization: Bearer YOUR_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"items":[{"sku":"BOOK-001","quantity":2}],"currency":"USD"}'
        - lang: javascript
          label: JavaScript (fetch)
          source: |
            const token = process.env.API_TOKEN;
            const response = await fetch("https://api.example.com/orders", {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${token}`,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                items: [{ sku: "BOOK-001", quantity: 2 }],
                currency: "USD"
              })
            });
            console.log(await response.json());
        - lang: python
          label: Python (requests)
          source: |
            import os
            import requests

            token = os.environ["API_TOKEN"]
            payload = {"items": [{"sku": "BOOK-001", "quantity": 2}], "currency": "USD"}
            headers = {"Authorization": f"Bearer {token}"}
            data = requests.post("https://api.example.com/orders", json=payload, headers=headers).json()
            print(data)
  /orders/{orderId}:
    get:
      tags: [orders]
      summary: Get order by ID
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -X GET "https://api.example.com/orders/ord_001" \
              -H "Authorization: Bearer YOUR_ACCESS_TOKEN"
        - lang: javascript
          label: JavaScript (fetch)
          source: |
            const token = process.env.API_TOKEN;
            const orderId = "ord_001";
            const response = await fetch(`https://api.example.com/orders/${orderId}`, {
              headers: { "Authorization": `Bearer ${token}` }
            });
            console.log(await response.json());
        - lang: python
          label: Python (requests)
          source: |
            import os
            import requests

            token = os.environ["API_TOKEN"]
            order_id = "ord_001"
            headers = {"Authorization": f"Bearer {token}"}
            data = requests.get(f"https://api.example.com/orders/{order_id}", headers=headers).json()
            print(data)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateOrderRequest:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              sku:
                type: string
              quantity:
                type: integer
                minimum: 1
            required: [sku, quantity]
        currency:
          type: string
          example: USD
      required: [items, currency]
    Order:
      type: object
      properties:
        id:
          type: string
          example: ord_001
        status:
          type: string
          example: pending
        totalAmount:
          type: number
          format: float
          example: 29.98
        currency:
          type: string
          example: USD
        items:
          type: array
          items:
            type: object
            properties:
              sku:
                type: string
              quantity:
                type: integer
      required: [id, status, totalAmount, currency, items]
