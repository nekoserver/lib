# /neko askgk の tunnels API は lib/claude の別名版CGIで応える（server.jsへ送らない）。
# restore-claude-host.sh が /etc/apache2/lib-tunnels.conf に置き、VirtualHostの
# `ProxyPass /` より前で Include する。秘密の値は lib-secrets.conf（0600、リポジトリ外）。
# LLMの待ちは最大300秒のため、CGIのタイムアウトはそれより長くする。
Include /etc/apache2/lib-secrets.conf
PassEnv CLOUDFLARE_ACCOUNT_ID
ProxyPass /lib/api/tunnels !
ScriptAlias /lib/api/tunnels /var/www/html/lib/claude/api/tunnels.claude.rb
<Location /lib/api/tunnels>
    CGIDScriptTimeout 330
</Location>
# デモイメージのvhostは/libを管理者専用として拒否する（利用者の判断、2026-11-11）。askgkは公開側の
# /lib/api/tunnels へ署名付きPOSTを送るため、このパスだけを署名ヘッダーがあるときに通す（本体SPEC
# lib-access-controlの「公開Apacheの例外」と同じ。イメージの lib-askgk-api.conf は2026-11-18時点で無い）。
# 後の<LocationMatch>が先の拒否より優先されるため、vhostの拒否の後でIncludeされる。署名の検証はCGIが行う（不正は401）。
<LocationMatch "^/lib/api/tunnels$">
    Require expr "-n %{HTTP:X-Timestamp} && -n %{HTTP:X-Signature}"
</LocationMatch>
